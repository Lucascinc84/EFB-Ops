/* ================= WEATHER: METAR / TAF parsing ================= */
const WX_WORDS={"-":"light","+":"heavy",VC:"vicinity",MI:"shallow",BC:"patches",PR:"partial",DR:"drifting",BL:"blowing",SH:"showers",TS:"thunderstorm",FZ:"freezing",
  DZ:"drizzle",RA:"rain",SN:"snow",SG:"snow grains",IC:"ice crystals",PL:"ice pellets",GR:"hail",GS:"small hail",UP:"unknown precip",BR:"mist",FG:"fog",FU:"smoke",VA:"volcanic ash",
  DU:"dust",SA:"sand",HZ:"haze",PO:"dust whirls",SQ:"squalls",FC:"funnel cloud",SS:"sandstorm",DS:"duststorm"};
const WX_RE=/^(\+|-|VC)?(MI|BC|PR|DR|BL|SH|TS|FZ)?((DZ|RA|SN|SG|IC|PL|GR|GS|UP|BR|FG|FU|VA|DU|SA|HZ|PO|SQ|FC|SS|DS)+)$/;
function decodeWx(tok){
  const m=WX_RE.exec(tok); if(!m) return "";
  const parts=[]; if(m[1]) parts.push(WX_WORDS[m[1]]); if(m[2]) parts.push(WX_WORDS[m[2]]);
  (m[3].match(/../g)||[]).forEach(p=>parts.push(WX_WORDS[p]));
  return parts.join(" ");
}
function parseCond(tokens){
  const c={wx:[],clouds:[]};
  for(const t of tokens){
    let m;
    if((m=/^(\d{3}|VRB)(\d{2,3})(?:G(\d{2,3}))?(KT|MPS)$/.exec(t))){ const k=m[4]==="MPS"?1.944:1; c.wdir=m[1]==="VRB"?null:+m[1]; c.vrb=m[1]==="VRB"; c.wspd=Math.round(+m[2]*k); c.gust=m[3]?Math.round(+m[3]*k):null; continue; }
    if((m=/^(\d{3})V(\d{3})$/.exec(t))){ c.wvar=[+m[1],+m[2]]; continue; }
    if(t==="CAVOK"){ c.cavok=true; c.vis=10000; continue; }
    if(/^\d{4}$/.test(t)&&c.vis==null){ c.vis=+t===9999?10000:+t; continue; }
    if((m=/^(P)?(\d{1,2})?(?:\s?(\d)\/(\d))?SM$/.exec(t))){ const v=(+(m[2]||0))+(m[3]?+m[3]/+m[4]:0); c.vis=Math.round(v*1609); if(m[1]) c.vis=10000; continue; }
    if((m=/^(FEW|SCT|BKN|OVC|VV)(\d{3}|\/\/\/)(CB|TCU)?$/.exec(t))){ c.clouds.push({cov:m[1],h:m[2]==="///"?null:+m[2]*100,type:m[3]||""}); continue; }
    if(/^(NSC|SKC|CLR|NCD)$/.test(t)){ c.nsc=true; continue; }
    if((m=/^(M?\d{2})\/(M?\d{2})?$/.exec(t))){ const f=s=>s?(s[0]==="M"?-+s.slice(1):+s):null; c.temp=f(m[1]); c.dew=f(m[2]); continue; }
    if((m=/^Q(\d{4})$/.exec(t))){ c.qnh=+m[1]; continue; }
    if((m=/^A(\d{4})$/.exec(t))){ c.qnh=Math.round(+m[1]/100*33.8639); c.inhg=+m[1]/100; continue; }
    const w=decodeWx(t); if(w) c.wx.push(w);
  }
  const ceil=c.clouds.filter(x=>/BKN|OVC|VV/.test(x.cov)&&x.h!=null).map(x=>x.h);
  c.ceil=ceil.length?Math.min(...ceil):null;
  c.cb=c.clouds.some(x=>x.type);
  return c;
}
function flightCat(c){
  if(c.vis==null&&c.ceil==null&&!c.cavok) return "";
  const v=c.vis==null?99999:c.vis, h=c.ceil==null?99999:c.ceil;
  if(h<500||v<1600) return "LIFR";
  if(h<1000||v<4800) return "IFR";
  if(h<=3000||v<=8000) return "MVFR";
  return "VFR";
}
function parseMetar(raw){
  const toks=raw.replace(/=$/,"").trim().split(/\s+/);
  let i=0; if(/^(METAR|SPECI)$/.test(toks[0])) i++; if(toks[i]==="COR") i++;
  const icao=toks[i]; const time=toks[i+1]&&/^\d{6}Z$/.test(toks[i+1])?toks[i+1]:"";
  let end=toks.findIndex((t,k)=>k>i&&/^(TEMPO|BECMG|NOSIG|RMK)$/.test(t)); if(end<0) end=toks.length;
  const c=parseCond(toks.slice(i+2,end));
  c.icao=icao; c.time=time; c.trend=toks.slice(end).join(" "); c.cat=flightCat(c); c.raw=raw.trim();
  return c;
}
function parseTaf(raw){
  const txt=raw.replace(/\s+/g," ").replace(/=$/,"").trim();

  const icao=toks[i]; i++;
  if(/^\d{6}Z$/.test(toks[i])) i++;
  const valid=/^\d{4}\/\d{4}$/.test(toks[i])?toks[i++]:"";
  const groups=[]; let cur={label:"BASE "+valid,toks:[]};
  for(;i<toks.length;i++){
    const t=toks[i];
    if(/^FM\d{6}$/.test(t)){ groups.push(cur); cur={label:"FM "+t.slice(2,4)+"/"+t.slice(4),toks:[]}; continue; }
    if(t==="BECMG"||t==="TEMPO"){ groups.push(cur); let lab=t; if(/^\d{4}\/\d{4}$/.test(toks[i+1])) lab+=" "+toks[++i]; cur={label:lab,toks:[]}; continue; }
    if(/^PROB\d{2}$/.test(t)){ groups.push(cur); let lab=t; if(toks[i+1]==="TEMPO") lab+=" "+toks[++i]; if(/^\d{4}\/\d{4}$/.test(toks[i+1])) lab+=" "+toks[++i]; cur={label:lab,toks:[]}; continue; }
    if(/^(TX|TN)/.test(t)) continue;
    cur.toks.push(t);
  }
  groups.push(cur);
  return {icao, valid, raw:txt, groups:groups.filter(g=>g.toks.length).map(g=>{const c=parseCond(g.toks);c.cat=flightCat(c);c.label=g.label;return c;})};
}
function splitWxReports(text){
  const lines=text.replace(/\r/g,"").split("\n");
  const out=[]; let cur=null;
  for(const l of lines){
    const t=l.trim(); if(!t){ continue; }
    if(/^TAF\b/.test(t)){ if(cur) out.push(cur); cur={kind:"TAF",raw:t}; continue; }
    if(/^(METAR|SPECI)\b/.test(t)||(/^[A-Z][A-Z0-9]{3}\s\d{6}Z\b/.test(t)&&!(cur&&cur.kind==="TAF"&&/^\s/.test(l)))){
      if(cur) out.push(cur);
      cur={kind:(cur&&cur.kind==="TAF"&&/^\s/.test(l))?"TAF":"METAR",raw:t}; continue; }
    if(cur){ cur.raw+=" "+t; }

const CAT_COL={VFR:"cat-vfr",MVFR:"cat-mvfr",IFR:"cat-ifr",LIFR:"cat-lifr"};

  const a=(wd-rh)*Math.PI/180; return {head:Math.round(ws*Math.cos(a)), cross:Math.round(ws*Math.sin(a))};
}

function wxAirports(){

/* ---- freshness: METAR age from its ddhhmmZ time, TAF validity from ddhh/ddhh ---- */
function zToDate(dd,hh,mm){ const n=new Date(); let d=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),+dd,+hh,+mm||0)); if(d-n>36*3600e3) d=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth()-1,+dd,+hh,+mm||0)); if(n-d>20*86400e3) d=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth()+1,+dd,+hh,+mm||0)); return d; }
function metarAge(raw){ const m=/\b(\d{2})(\d{2})(\d{2})Z\b/.exec(raw||""); if(!m) return null; return Math.round((Date.now()-zToDate(m[1],m[2],m[3]))/60000); }
function tafEnd(raw){ const m=/\b\d{4}\/(\d{2})(\d{2})\b/.exec(raw||""); if(!m) return null; return m[2]==="24"?new Date(zToDate(m[1],0,0).getTime()+86400e3):zToDate(m[1],m[2],0); }
const tafValid=raw=>{ const e=tafEnd(raw); return e?e>new Date():false; };
const METAR_MAX_MIN=60;
function wxFor(icao){
  const L=(S.wx.live&&S.wx.live[icao])||{}; const s=S.ofp&&S.ofp.sum;
  const o=s?({[s.from]:[s.metar.dep,s.taf.dep],[s.to]:[s.metar.arr,s.taf.arr],[s.altn]:[s.metar.altn,""]}[icao]||[]):[];
  const cand=[["live",L.metar],["OFP",o[0]]].filter(x=>x[1]).map(x=>({src:x[0],raw:x[1],age:metarAge(x[1])}));
  cand.sort((x,y)=>(x.age==null?1e9:x.age)-(y.age==null?1e9:y.age));
  const mc=cand[0]||null;
  const tc=[["live",L.taf],["OFP",o[1]]].filter(x=>x[1]);
  const tv=tc.find(x=>tafValid(x[1].startsWith("TAF")?x[1]:"TAF "+x[1]))||tc[0]||null;
  return {metar:mc&&mc.raw, src:mc?mc.src:"", age:mc?mc.age:null, taf:tv&&tv[1], tafSrc:tv?tv[0]:"", tafOk:tv?tafValid(tv[1]):false, at:L.at, fetched:L.fetched};
}
function wxNeedsLive(icao,role){
  const w=wxFor(icao);
  if(role==="EXTRA"&&!w.metar) return true;
  if(!w.metar||w.age==null||w.age>METAR_MAX_MIN) return true;
  if(w.taf&&!w.tafOk) return true;
  if(!w.taf&&role!=="EXTRA"&&role!=="ALTN") return true;

}
const relayUrl=()=>(S.settings.relay||"").trim().replace(/\/+$/,"");
let WX_BUSY=false;
async function wxFetchLive(icaos,manual){

  try{
    const res=await fetch(url,{cache:"no-store"}); if(!res.ok) throw new Error(res.status);
    const txt=await res.text(); const now=new Date().toISOString(); S.wx.live=S.wx.live||{};
    icaos.forEach(i=>{ (S.wx.live[i]=S.wx.live[i]||{}).fetched=now; });

  }catch(e){

let SIG={text:"",at:0};
async function sigmetFetch(){ const r=relayUrl(); if(!r) return; try{ const res=await fetch(r+"/sigmet",{cache:"no-store"}); if(res.ok){ SIG={text:(await res.text()).slice(0,400000),at:Date.now()}; } }catch(e){} }
function sigmetsFor(prefixes){
  if(!SIG.text) return [];
  const blocks=SIG.text.replace(/\r/g,"").split(/\n(?=\S*W[SCV][A-Z]{2}\d{2}\b)|\n\s*\n/).map(x=>x.trim()).filter(x=>x.length>20);

function ofpBlock(re,max=40){
  const t=S.ofp&&S.ofp.text; if(!t) return "";

  for(const p in WIZZ_SERIES_LETTERS){ if(reg.startsWith(p)&&reg.length===p.length+1){ const l=reg.slice(-1); const g=WIZZ_SERIES_LETTERS[p].find(x=>x[0].includes(l)); if(g) return g[1]; } }
  const s=[...WIZZ_SERIES].sort((x,y)=>y[0].length-x[0].length).find(x=>reg.startsWith(x[0]));
  return s?s[1]:null;
}
function acYear(reg){
  reg=(reg||"").toUpperCase().trim(); if(!reg) return null;
  const u=S.acdb&&S.acdb.list&&S.acdb.list[reg];
  if(u&&+u.year) return {year:+u.year,src:"your fleet DB"};
  const w=wizzYear(reg); if(w) return {year:w,src:"est. from Wizz reg. series"};
  return null;
}
const afLink=reg=>`<a class="mini-btn" href="https://www.airfleets.fr/recherche/?key=${encodeURIComponent(reg)}" target="_blank" rel="noopener">Airfleets ↗</a>`;
function acdbSet(reg,year,extra){ S.acdb.list=S.acdb.list||{}; const r=reg.toUpperCase().trim(); S.acdb.list[r]=Object.assign(S.acdb.list[r]||{}, {year:String(year)}, extra||{}); save("acdb"); const y=window.scrollY; render(); window.scrollTo(0,y); toast(r+" saved · built "+year); }

function pfFromAge(age){ return age<1?0:age<4?1:age<8?2:age<12?3:age<16?4:5; }
function pfReg(){ const s=S.ofp&&S.ofp.sum; const pa=S.perf.ac; return ((pa&&pa.mode==="manual"&&pa.reg)||currentAc().reg||(s&&s.reg)||"").toUpperCase().trim(); }
function pfAutoInfo(){ const reg=pfReg(); const y=acYear(reg); if(!y) return {reg,year:null}; const age=Math.max(0,NOW_YEAR-y.year); return {reg,year:y.year,src:y.src,age,pf:pfFromAge(age)}; }
function pfVal(){
  if(S.perf.pfMode!=="manual"){ const i=pfAutoInfo(); if(i.year) return i.pf; }
  const v=parseFloat(S.perf.pf); return isNaN(v)?0:Math.max(-5,Math.min(15,v));
}
function pfExtraBurn(){ const s=S.ofp&&S.ofp.sum; if(!s||!s.fuel.trip) return 0; return Math.round(+s.fuel.trip*pfVal()/100); }

  <span class="pf-eff">${pf&&s?`trip ${x>0?"+":""}${num(x)} ${u} · landing fuel ${x>0?"−":"+"}${num(Math.abs(x))} ${u}`:"applies to fuel burn & landing weight — not to distances"}</span>
  <button class="pf-tog" data-pftog>${S.perf.pfOpen?"Hide table ▴":"Typical values ▾"}</button></div>${S.perf.pfOpen?pfTableHTML():""}</div>`; }

/* ================= RUNWAY VIEW (diagram + remembered runway data & exits) ================= */
function rwyKey(icao,rwy){ icao=(icao||"").toUpperCase().trim(); rwy=(rwy||"").toUpperCase().trim(); return icao&&rwy?icao+"/"+rwy:""; }
function rwyRec(icao,rwy){ const k=rwyKey(icao,rwy); if(!k) return null; S.rwys.db=S.rwys.db||{}; return S.rwys.db[k]||(S.rwys.db[k]={len:"",exits:[]}); }
function perfAirports(){
  const s=S.ofp&&S.ofp.sum, h=S.briefing.hdr;
  return {dep:(h.from||(s&&s.from)||"").toUpperCase(), arr:(h.to||(s&&s.to)||"").toUpperCase()};
}
function estimateExit(exits,stop){
  // RET can be taken at ~40–50 kt: about 250 m before the full-stop point; 90° exits need ~taxi speed
  const sorted=[...exits].filter(e=>+e.d>0).sort((a,b)=>+a.d-+b.d);
  return sorted.find(e=>+e.d>=stop-(e.ret?250:40))||null;
}
function runwaySvg(o){
  // o: {len, rwy, mode, marks:[{d,label,cls,dash}], exits:[{n,d,ret}], est, zones:bool}
  const W=1000, X0=70, X1=W-30, L=Math.max(o.len||0,...o.marks.map(m=>m.d||0),...(o.exits||[]).map(e=>+e.d||0),500)*1.04;
  const sx=d=>X0+(X1-X0)*Math.min(d,L)/L, Y=92, H=34;
  const lenX=o.len?sx(o.len):X1;
  let g=`<rect x="0" y="0" width="${W}" height="190" fill="#121317"/>`;
  // grass/overrun beyond LDA
  if(o.len) g+=`<rect x="${lenX}" y="${Y}" width="${Math.max(0,X1-lenX)}" height="${H}" fill="#2b1d22" stroke="#5a2630" stroke-dasharray="4 4"/>`;
  g+=`<rect x="${X0}" y="${Y}" width="${lenX-X0}" height="${H}" fill="#2a2c33" stroke="#55596a"/>`;
  // threshold bars
  for(let i=0;i<6;i++) g+=`<rect x="${X0+4}" y="${Y+3+i*5}" width="14" height="3" fill="#d9dbe3"/>`;
  g+=`<text x="${X0+26}" y="${Y+H/2+5}" fill="#eceef3" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" font-weight="700" transform="rotate(90 ${X0+26} ${Y+H/2})" text-anchor="middle">${esc(o.rwy||"")}</text>`;
  // centreline

  const n=kind==="ep1"?1:kind==="ep4"?4:3, sw=n===4?5.2:6, gap=n===4?3.6:5, tot=n*sw+(n-1)*gap, x0=(52-tot)/2;

/* ---------- Full screen (hides everything around the app) ---------- */
function fsEl(){ return document.fullscreenElement||document.webkitFullscreenElement; }
function fsSupported(){ const d=document.documentElement; return !!((document.fullscreenEnabled||document.webkitFullscreenEnabled)&&(d.requestFullscreen||d.webkitRequestFullscreen)); }
function setImmersive(on){ S.settings.imm=!!on; save("settings"); document.documentElement.classList.toggle("imm",!!on); updateFsBtn(); }
function toggleFullscreen(){
  const d=document.documentElement;
  if(fsEl()){ try{ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }catch(e){} return; }
  if(S.settings.imm){ setImmersive(false); return; }
  if(fsSupported()){
    try{ const p=(d.requestFullscreen||d.webkitRequestFullscreen).call(d,{navigationUI:"hide"});
      if(p&&p.catch) p.catch(()=>{ setImmersive(true); toast("Immersive mode — true full screen is blocked here"); }); return; }
    catch(e){}
  }
  setImmersive(true); toast("Immersive mode — true full screen is blocked here");
}
function updateFsBtn(){ const b=$("#fsBtn"); if(!b) return; const on=!!fsEl()||!!S.settings.imm; b.classList.toggle("on",on);
  b.innerHTML=on?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>':'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>'; }
document.addEventListener("fullscreenchange",updateFsBtn); document.addEventListener("webkitfullscreenchange",updateFsBtn);
/* ---------- Export / Import all data ---------- */
function exportData(){
  const data={}; Object.keys(DEFAULTS).forEach(k=>data[k]=S[k]);
  const json=JSON.stringify({app:"efb",v:1,exported:new Date().toISOString(),data});
  openModal(`<div class="modal-h"><h3>Export all data</h3><button class="x" data-close>×</button></div>
   <div style="padding:14px 16px"><p class="muted" style="font-size:12.5px;margin-top:0">${S.flights.list.length} flights, ${Object.keys(S.acdb.list||{}).length} saved aircraft, runway exits, settings, current OFP. Copy it, then use <b>Import data</b> in the other EFB.</p>
   <textarea class="copybox" readonly id="expTxt">${esc(json)}</textarea></div>
   <div class="modal-f">${IS_SA?'<button class="btn ghost" id="expDl">Save file</button>':""}<span class="sp"></span><button class="btn mag" id="expCp">Copy</button></div>`);
  $("#modal").querySelector("[data-close]").onclick=closeModal;
  $("#expCp").onclick=()=>navigator.clipboard.writeText(json).then(()=>toast("Copied — paste it in Import data")).catch(()=>{$("#expTxt").select();toast("Select all & copy")});
  const dl=$("#expDl"); if(dl) dl.onclick=()=>{ const u=URL.createObjectURL(new Blob([json],{type:"application/json"})); const x=document.createElement("a"); x.href=u; x.download="efb-backup-"+new Date().toISOString().slice(0,10)+".json"; document.body.appendChild(x); x.click(); x.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); };
}
function importData(){
  openModal(`<div class="modal-h"><h3>Import data</h3><button class="x" data-close>×</button></div>
   <div style="padding:14px 16px"><p class="muted" style="font-size:12.5px;margin-top:0">Paste the exported data (or pick the backup file). It <b>replaces</b> the data on this device.</p>
   <textarea class="copybox" id="impTxt" placeholder="Paste here"></textarea><div class="err" id="impErr"></div></div>
   <div class="modal-f"><label class="btn ghost" style="cursor:pointer">File<input type="file" id="impFile" accept=".json,application/json" hidden></label><span class="sp"></span><button class="btn mag" id="impGo">Import</button></div>`);
  $("#modal").querySelector("[data-close]").onclick=closeModal;
  const run=txt=>{ try{ const o=JSON.parse(txt); if(!o||o.app!=="efb"||!o.data) throw 0;
      Object.keys(DEFAULTS).forEach(k=>{ if(o.data[k]) { S[k]=Object.assign({},DEFAULTS[k],o.data[k]); save(k); } });
      migrate(); applyLogImports(); normalizeTypes(); applyMode(); closeModal(); render(); toast(`Imported · ${S.flights.list.length} flights`);
    }catch(e){ $("#impErr").textContent="This is not an EFB export."; } };
  $("#impGo").onclick=()=>run($("#impTxt").value.trim());
  $("#impFile").onchange=e=>{ const f=e.target.files[0]; if(f) f.text().then(run); };
}
function toggleDrawer(show){$("#drawer").classList.toggle("show",show);$("#dscrim").classList.toggle("show",show);document.documentElement.classList.toggle("lock",!!show);if(show){renderDrawer();$("#drawer").scrollTop=0;}}
$("#menuBtn").onclick=()=>toggleDrawer(true);
$("#dscrim").onclick=()=>toggleDrawer(false);
$("#pilotName").onclick=()=>toggleDrawer(true);
$("#rankBadge").onclick=()=>rankModal();
$("#fsBtn").onclick=()=>toggleFullscreen();

function render(){
  updateTabs(); updateStatus();
  const m=MODULES.find(x=>x.id===current); m.render($("#view"));
}
window.addEventListener("hashchange",()=>go(location.hash.slice(1)));
applyMode();
document.documentElement.classList.toggle("imm",!!S.settings.imm); setTimeout(updateFsBtn,0);
document.documentElement.classList.toggle("imm",!!S.settings.imm); setTimeout(updateFsBtn,0);
go(location.hash.slice(1)||"briefing");
connect();

if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }</script>
</body>
