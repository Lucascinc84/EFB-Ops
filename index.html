<!DOCTYPE html>
<html lang="en" data-mode="wizz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16171b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EFB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>EFB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1013; --frame:#16171b; --panel:#1f2026; --panel2:#262830; --line:#33353f;
  --text:#eceef3; --muted:#9a9eab; --dim:#6c707c;
  --mag:#c6007e; --mag2:#e2238f; --purple:#3a2a6e;
  --green:#3ecf8e; --amber:#f2b33d; --red:#ff5a6a; --cyan:#58c7e8;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --r:10px; --nextbg:#2a2230; --brandgrad:linear-gradient(90deg,#c6007e 0%,#8a1a8f 55%,#3a2a6e 100%);
}
:root[data-mode=global]{--mag:#1f6fe5;--mag2:#5aa2ff;--purple:#0b2b63;--nextbg:#18263a;--brandgrad:linear-gradient(90deg,#1f6fe5 0%,#1550b8 55%,#0b2b63 100%);}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}
.app{max-width:1180px;margin:0 auto;min-height:100vh;background:var(--frame);display:flex;flex-direction:column}
@media(min-width:900px){.app{margin:18px auto;min-height:calc(100vh - 36px);border-radius:26px;border:10px solid #000;box-shadow:0 0 0 1px #222,0 30px 80px #000a;overflow:hidden}}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--frame);position:sticky;top:0;z-index:20;border-bottom:1px solid #22242b}
.menu-btn{width:40px;height:38px;border:0;border-radius:6px;background:var(--mag);display:grid;place-items:center;flex:none}
.brand{height:38px;padding:0 16px;border-radius:4px;background:var(--brandgrad);display:flex;align-items:center;gap:8px;flex:none;min-width:150px}
.brand b{font-weight:800;font-style:italic;letter-spacing:.5px;font-size:20px;color:#fff}
.brand span{font-size:10px;font-weight:600;color:#ffd7ef;letter-spacing:1.5px;text-transform:uppercase;line-height:1.1}
.status{margin:0 auto;display:flex;align-items:stretch;background:var(--panel);border-radius:6px;font-size:12.5px;overflow:hidden}
.status>div{padding:10px 14px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.status>div+div{border-left:1px solid var(--line)}
.sync{color:var(--green);font-weight:600}
.sync.local{color:var(--amber)}
.pilot{font-size:13px;color:var(--muted);flex:none;cursor:pointer;background:none;border:0}
@media(max-width:760px){.status .mode,.brand span{display:none}.status{font-size:11.5px}.status>div{padding:9px 10px}.brand{min-width:0;padding:0 12px}.pilot{display:none}}

/* ---------- module tabs ---------- */
.tabs{display:flex;gap:4px;padding:0 16px;background:var(--frame);border-bottom:1px solid #22242b;overflow-x:auto;position:sticky;top:67px;z-index:19}
.tab{background:none;border:0;padding:12px 16px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tab.on{color:#fff;border-bottom-color:var(--mag)}
.tab .pill{font-size:11px;font-family:var(--mono);background:var(--panel2);border-radius:20px;padding:1px 7px;color:var(--muted)}
.tab.on .pill{background:var(--mag);color:#fff}

/* ---------- page ---------- */
main{flex:1;padding:18px 16px 60px}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.title-chip{background:#fff;color:#111;font-weight:700;font-size:17px;padding:7px 14px;border-radius:8px}
.page-head .sp{flex:1}
.btn{border:0;border-radius:4px;padding:10px 16px;font-size:12.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;background:var(--panel2);color:var(--text)}
.btn.primary{background:#b9bfd6;color:#111;border-left:3px solid var(--green)}
.btn.mag{background:var(--mag);color:#fff}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
.btn.danger{background:none;border:1px solid #5a2630;color:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
h2.sec{font-size:15px;font-weight:700;margin:22px 0 8px;display:flex;align-items:center;gap:10px}
h2.sec .count{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-weight:400}
.card{background:var(--panel);border-radius:4px;padding:12px 12px}
.card+.card{margin-top:8px}
.muted{color:var(--muted)} .mono{font-family:var(--mono)}
.badge{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:3px;border:1px solid var(--green);color:var(--green);letter-spacing:.3px}
.badge.grey{border-color:transparent;background:#3a3c45;color:#ddd}
.badge.amber{border-color:var(--amber);color:var(--amber)}
.empty{border:1px solid #4a4d58;border-radius:3px;padding:9px 12px;font-style:italic;color:#c7c9d1;font-size:13px}

/* ---------- briefing ---------- */
.flight-hdr{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
@media(max-width:760px){.flight-hdr{grid-template-columns:repeat(2,1fr)}}
.fld label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.fld input,.fld select,.frm input,.frm select,.frm textarea{width:100%;background:#15161a;border:1px solid var(--line);border-radius:4px;padding:9px 10px;font-size:14px;outline:none}
.fld input:focus,.frm input:focus,.frm textarea:focus,.frm select:focus,.brow input:focus{border-color:var(--mag)}
.fld input.big{font-family:var(--mono);font-size:16px;font-weight:600;text-transform:uppercase}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.bgrid{grid-template-columns:1fr}}
.bcard{background:var(--panel);border-radius:4px;overflow:hidden}
.bcard-h{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--panel2);cursor:pointer;user-select:none}
.bcard-h .role{font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 7px;border-radius:3px;background:var(--mag);color:#fff}
.bcard-h .role.pf{background:#5b4bb0}
.bcard-h h3{margin:0;font-size:14px;flex:1}
.bcard-h .prog{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.bcard-h .prog.done{color:var(--green)}
.bar{height:3px;background:#2d2f38}.bar i{display:block;height:100%;background:var(--mag);transition:width .25s}
.bar.done i{background:var(--green)}
.bbody{padding:6px 12px 12px}
.bcard.closed .bbody{display:none}
.brow{display:grid;grid-template-columns:175px 1fr;gap:10px;align-items:center;padding:5px 0;border-bottom:1px dashed #2b2d35}
.brow:last-child{border-bottom:0}
.brow label{font-size:12.5px;color:#c9ccd6}
.brow input{width:100%;background:transparent;border:1px solid transparent;border-bottom-color:#3a3d48;border-radius:3px;padding:7px 8px;font-size:14px;font-family:var(--mono);outline:none}
.brow input:not(:placeholder-shown){color:#fff}
.brow .tri{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.brow.filled label::before{content:"●";color:var(--green);font-size:8px;margin-right:6px;vertical-align:2px}
@media(max-width:560px){.brow{grid-template-columns:1fr;gap:2px}}

/* ---------- checklist ---------- */
.cl-wrap{display:grid;grid-template-columns:250px 1fr;gap:16px}
@media(max-width:820px){.cl-wrap{grid-template-columns:1fr}}
.cl-nav{display:flex;flex-direction:column;gap:3px;position:sticky;top:130px;align-self:start}
@media(max-width:820px){.cl-nav{flex-direction:row;overflow-x:auto;position:static;padding-bottom:4px}}
.cl-nav button{background:var(--panel);border:0;border-left:3px solid transparent;text-align:left;padding:9px 10px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;border-radius:3px;white-space:nowrap}
.cl-nav button.on{border-left-color:var(--mag);background:var(--panel2)}
.cl-nav button .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
.cl-nav button.done .n{color:var(--green)}
.cl-nav button.done .dot{background:var(--green)}
.dot{width:8px;height:8px;border-radius:50%;background:#444852;flex:none}
.cl-nav button.part .dot{background:var(--amber)}
.overall{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin-bottom:10px}
.overall .bar{flex:1;height:5px;border-radius:3px;overflow:hidden}
.cl-title{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cl-title h3{margin:0;font-size:16px;letter-spacing:.5px;flex:1}
.item{display:flex;align-items:center;gap:12px;width:100%;background:var(--panel);border:0;border-left:3px solid transparent;padding:12px 12px;margin-bottom:3px;text-align:left;border-radius:3px;font-family:var(--mono);font-size:13.5px}
.item .chk{width:22px;height:22px;border-radius:4px;border:2px solid #555a66;flex:none;display:grid;place-items:center}
.item .lbl{flex:none;max-width:55%}
.item .lead{flex:1;border-bottom:2px dotted #4a4d58;transform:translateY(-4px);min-width:12px}
.item .val{flex:none;font-weight:600;color:var(--cyan);text-align:right;max-width:40%}
.item.action .lbl{font-family:Inter,sans-serif;font-style:italic;color:#c9ccd6;max-width:none}
.item.next{border-left-color:var(--mag);background:var(--nextbg)}
.item.on{background:#18261f}
.item.on .chk{background:var(--green);border-color:var(--green)}
.item.on .lbl,.item.on .val{color:#7fa592}
.item.on .val{text-decoration:line-through;text-decoration-color:#4f6d5f}
.banner{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--amber);background:#2a2516;border-radius:3px;padding:9px 12px;margin:8px 0 6px;letter-spacing:.5px}
.subhead{font-size:11.5px;color:var(--mag2);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin:14px 0 6px}
.complete{margin-top:14px;padding:14px;border-radius:4px;background:#14281e;border:1px solid #275b41;color:var(--green);font-weight:700;letter-spacing:1px;text-align:center;font-family:var(--mono)}
.cl-foot{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

/* ---------- logbook ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel);border-radius:4px;padding:12px}
.stat small{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.stat b{font-family:var(--mono);font-size:22px;font-weight:600}
.toolbar{display:flex;gap:8px;margin:16px 0 8px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:160px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:9px 12px;outline:none}
.toolbar input:focus{border-color:var(--mag)}
table.log{width:100%;border-collapse:separate;border-spacing:0 3px;font-size:13px}
table.log th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:6px 10px;text-transform:uppercase;letter-spacing:.5px}
table.log td{background:var(--panel);padding:11px 10px;font-family:var(--mono);white-space:nowrap}
table.log tr.row{cursor:pointer}
table.log tr.row:hover td{background:var(--panel2)}
table.log td:first-child{border-left:3px solid var(--mag);border-radius:3px 0 0 3px}
table.log td:last-child{border-radius:0 3px 3px 0;color:var(--dim);text-align:right}
td.route b{color:#fff}
td.route i{font-style:normal;color:var(--dim);margin:0 6px}
td.blk{color:var(--green);font-weight:600}
tfoot td{background:none!important;border:0!important;font-family:Inter;font-size:12px;color:var(--muted)}
tfoot td b{font-family:var(--mono);color:#fff;font-size:15px}
.tbl-scroll{overflow-x:auto}
/* mobile log as cards */
@media(max-width:640px){
  table.log thead{display:none}
  table.log,table.log tbody,table.log tr,table.log td{display:block;width:100%}
  table.log tr.row{background:var(--panel);border-left:3px solid var(--mag);border-radius:3px;margin-bottom:6px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;row-gap:3px}
  table.log td{background:none!important;padding:0;border:0!important;border-radius:0!important}
  table.log td.c-date{color:var(--muted);font-size:11.5px}
  table.log td.c-type{grid-column:2;grid-row:1;text-align:right;color:var(--muted);font-size:11.5px}
  table.log td.route{font-size:15px;grid-column:1}
  table.log td.blk{grid-column:2;grid-row:2;text-align:right}
  table.log td.c-cs{font-size:12px;color:var(--cyan)}
  table.log td.c-times{grid-column:2;text-align:right;font-size:12px;color:var(--muted)}
  table.log td:last-child{display:none}
  tfoot tr{display:block}
}

/* ---------- modal / drawer / toast ---------- */
.scrim{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.scrim.show{display:flex}
.modal{background:var(--panel);border-radius:10px;width:100%;max-width:560px;max-height:92vh;overflow:auto;border:1px solid var(--line)}
.modal-h{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:16px;flex:1}
.x{background:none;border:0;font-size:22px;color:var(--muted);line-height:1}
.frm{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frm .full{grid-column:1/-1}
.frm label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.frm .icao{font-family:var(--mono);text-transform:uppercase;font-size:16px;letter-spacing:1px}
.frm .err{grid-column:1/-1;color:var(--red);font-size:12.5px;min-height:16px}
.modal-f{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.modal-f .sp{flex:1}
.drawer{position:fixed;top:0;left:0;bottom:0;width:290px;background:var(--panel);z-index:60;transform:translateX(-100%);transition:transform .2s;padding:18px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
.drawer.show{transform:none}
.drawer h4{margin:14px 0 6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.drawer .mod{background:none;border:0;text-align:left;padding:10px;border-radius:4px;font-weight:600;display:flex;gap:10px;align-items:center}
.drawer .mod.on{background:var(--panel2);color:#fff}
.drawer .soon{opacity:.45;cursor:default;font-weight:500}
.dscrim{position:fixed;inset:0;background:#0008;z-index:55;display:none}
.dscrim.show{display:block}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);background:#2c2e37;border:1px solid var(--line);border-left:3px solid var(--green);padding:11px 16px;border-radius:5px;font-size:13px;z-index:80;transition:transform .25s}
.toast.show{transform:translateX(-50%)}
.confirm-txt{padding:16px;font-size:14px;line-height:1.5}
textarea.copybox{width:100%;height:220px;font-family:var(--mono);font-size:12px;background:#15161a;border:1px solid var(--line);border-radius:4px;padding:10px}

/* ---------- v2: mode switch, aircraft selectors, checklist picker ---------- */
.seg{display:flex;align-items:center;gap:2px;padding:4px!important}
.seg button{border:0;background:none;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.5px;padding:6px 10px;border-radius:4px;text-transform:uppercase}
.seg button.on{background:var(--mag);color:#fff}
.ac-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
@media(max-width:760px){.ac-row{grid-template-columns:repeat(2,1fr)}}
.fld select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
.fld select.big{font-family:var(--mono);font-size:15px;font-weight:600}
.ac-tag{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-top:8px}
.ac-tag b{color:var(--text);font-family:var(--mono)}
.cl-pick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cl-pick button{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--muted)}
.cl-pick button.on{background:var(--mag);border-color:var(--mag);color:#fff}
.cl-src{font-size:11.5px;color:var(--dim);margin:-4px 0 12px}
.cl-src.warn{color:var(--amber)}
.info{font-size:12.5px;color:#c9ccd6;background:var(--panel);border-left:3px solid #4a4d58;padding:9px 12px;margin-bottom:3px;border-radius:3px;line-height:1.45}
.tag{font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px;margin-right:6px;background:#3a3c45;color:#fff;vertical-align:1px}
.tag.at{background:#2b5b3f}.tag.noat{background:#5b2b33}.tag.gpu{background:#5b4b1f}
td.c-type small{display:block;color:var(--cyan);font-size:11px}
.mode-note{font-size:12px;color:var(--muted);padding:2px 10px 8px}

@media(max-width:560px){#stFlight{display:none}.status{margin-left:auto;margin-right:0}}

.flight-hdr.fh4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.flight-hdr.fh4{grid-template-columns:repeat(2,1fr)}}

.brand .logo{width:28px;height:28px;flex:none;filter:drop-shadow(0 1px 2px #0005)}
.brand{gap:9px}
@media(max-width:760px){.brand .logo{width:24px;height:24px}}

/* ---------- OFP ---------- */
.imp-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}.imp-h .muted{font-size:11.5px;margin-left:auto}
.imp-grid{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
@media(max-width:640px){.imp-grid{grid-template-columns:1fr}}
.imp-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
a.btn{text-decoration:none;display:inline-block}
.steps{margin:12px 0 10px;padding-left:20px;font-size:12.5px;color:#c9ccd6;line-height:1.7}
.ofp-hero{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;align-items:center;background:var(--panel);border-radius:4px;padding:16px;margin-top:16px;border-left:3px solid var(--mag)}
.ofp-hero small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ofp-hero b{display:block;font-family:var(--mono);font-size:28px}
.ofp-hero span{font-size:12px;color:var(--cyan);font-family:var(--mono)}
.ofp-hero .mid{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.ofp-hero .mid i{display:block;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--mag),transparent)}
.ofp-hero .mid span{color:var(--muted)} .ofp-hero .mid .mono{color:#fff;font-size:14px;font-weight:600}
@media(max-width:560px){.ofp-hero b{font-size:21px}.ofp-hero{padding:12px}}
.kvs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
@media(max-width:760px){.kvs{grid-template-columns:repeat(2,1fr)}}
.kv{background:var(--panel);border-radius:4px;padding:10px 12px}.kv small{display:block;font-size:11px;color:var(--muted)}.kv b{font-family:var(--mono);font-size:14px}
.route-box{font-size:12.5px;line-height:1.6;word-break:break-word}
h3.mini{margin:0 0 8px;font-size:13px;color:var(--mag2);text-transform:uppercase;letter-spacing:1px}
table.ft{width:100%;border-collapse:collapse;font-size:13px}
table.ft td{padding:6px 2px;border-bottom:1px dashed #2f313a}table.ft td:last-child{text-align:right;font-family:var(--mono)}
table.ft tr.st td{color:#fff;font-weight:600}
.wx{margin-bottom:6px}.wx small{font-size:11px;color:var(--mag2);font-weight:700}.wx .mono{font-size:12.5px;line-height:1.5;margin-top:3px}.wx .taf{font-size:11.5px}
pre.ofp-txt{background:#0c0d10;border:1px solid var(--line);border-radius:4px;padding:12px;font-family:var(--mono);font-size:11px;line-height:1.35;overflow-x:auto;white-space:pre;color:#d7dae2}

.ofp-sec{margin-bottom:10px;scroll-margin-top:170px}
.ofp-sec-h{display:flex;align-items:center;gap:8px;padding:6px 2px}

.totop{background:none;border:0;color:var(--dim);font-size:11px}


.ofp-box{position:relative;height:calc(100vh - 240px);min-height:380px;max-height:900px;overflow:auto;background:#0c0d10;border:1px solid var(--line);border-radius:4px;-webkit-overflow-scrolling:touch;scrollbar-width:auto;scrollbar-color:var(--mag) #1d1e24}

.ofp-box::-webkit-scrollbar-track{background:#1d1e24}

.ofp-mk{display:block;height:0}

.ac-photo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:8px 10px;background:#17181d;border:1px solid var(--line);border-radius:4px;font-size:12.5px;color:var(--muted)}

.ac-photo .cam{font-size:15px}

@media(max-width:560px){.ac-photo a:first-of-type{margin-left:0}}

/* ---------- Weather ---------- */
.cat{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 7px;border-radius:3px;color:#0f1013}
.cat-vfr{background:#3ecf8e}.cat-mvfr{background:#58a6ff}.cat-ifr{background:#ff5a6a}.cat-lifr{background:#d36bff}
.wx-card{background:var(--panel);border-radius:4px;padding:12px;margin-top:10px;border-left:3px solid var(--mag)}
.wx-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}.wx-h b{font-size:18px}.wx-h .sp{flex:1}
.role-t{font-family:var(--mono);font-size:10.5px;font-weight:700;background:#3a3c45;padding:2px 6px;border-radius:3px}

.wx-grid>div{background:#17181d;border-radius:3px;padding:7px 9px}.wx-grid small{display:block;font-size:10.5px;color:var(--muted)}.wx-grid b{font-family:var(--mono);font-size:13px}
.wx-comp{display:flex;gap:14px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}.wx-comp b{font-family:var(--mono);color:var(--green)}.wx-comp b.neg{color:var(--amber)}
.wx-raw{font-size:11.5px;color:#c9ccd6;background:#0c0d10;border-radius:3px;padding:8px 10px;margin-top:8px;line-height:1.5;word-break:break-word}
.taf{margin-top:10px}.taf-h{font-size:11px;font-weight:700;color:var(--mag2);letter-spacing:1px;margin-bottom:4px}
.taf-r{display:grid;grid-template-columns:150px 52px 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed #2f313a;font-size:12.5px}
.taf-l{font-size:11.5px;color:var(--cyan)}.taf-c{color:#d7dae2}
@media(max-width:560px){.taf-r{grid-template-columns:1fr auto}.taf-c{grid-column:1/-1}}
details summary{cursor:pointer;font-size:11.5px;color:var(--muted);margin-top:6px}
.link-row{margin-top:14px}.link-row a{color:var(--cyan);font-size:12.5px;text-decoration:none}
/* ---------- Wind ---------- */
.wind-wrap{display:grid;grid-template-columns:320px 1fr;gap:12px}
@media(max-width:820px){.wind-wrap{grid-template-columns:1fr}}
.wind-in{display:flex;flex-direction:column;gap:10px}
.wf label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.wf input,.wf select{width:100%;background:#15161a;border:1px solid var(--line);border-radius:4px;padding:10px;font-size:15px;outline:none;font-family:var(--mono)}

.wf.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wind-out{display:flex;flex-direction:column;align-items:center;gap:12px;border-top:3px solid #3a3c45}
.wind-out.ok{border-top-color:var(--green)}.wind-out.warn{border-top-color:var(--amber)}.wind-out.bad{border-top-color:var(--red)}
.rwy-svg{width:100%;max-width:300px}
.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.comp{background:#17181d;border-radius:4px;padding:10px 12px;border-left:3px solid var(--green)}
.comp.warn{border-left-color:var(--amber)}.comp.bad{border-left-color:var(--red)}
.comp small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.5px}.comp b{font-family:var(--mono);font-size:30px}.comp i{font-style:normal;font-size:13px;color:var(--muted)}
.lim-pill{font-family:var(--mono);font-weight:700;letter-spacing:1px;font-size:13px;padding:8px 14px;border-radius:4px;background:#2a2c33;color:var(--muted);width:100%;text-align:center}
.lim-pill.ok{background:#14281e;color:var(--green)}.lim-pill.warn{background:#2a2516;color:var(--amber)}.lim-pill.bad{background:#2c1418;color:var(--red)}
.lim-note{font-size:11px;color:var(--dim);line-height:1.5;text-align:center}
/* ---------- Fuel ---------- */
.fuel-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:760px){.fuel-kpi{grid-template-columns:repeat(2,1fr)}}
.kv.ok{border-left:3px solid var(--green)}.kv.warn{border-left:3px solid var(--amber)}.kv.bad{border-left:3px solid var(--red)}
.neg{color:var(--amber)!important}.pos{color:var(--green)!important}
.fuel-tbl{display:flex;flex-direction:column;gap:2px}
.fr{display:grid;grid-template-columns:1.4fr .8fr 1fr .9fr 1.2fr .9fr;gap:6px;align-items:center;background:var(--panel);padding:6px 10px;border-radius:3px;font-size:13px;border-left:3px solid transparent}
.fr.fh{background:none;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.fr.next{border-left-color:var(--mag);background:var(--nextbg)}
.fr.badrow{border-left-color:var(--red)}
.fp small{display:block;font-size:10.5px;color:var(--dim)}
.fin{width:100%;background:#15161a;border:1px solid var(--line);border-radius:3px;padding:7px 8px;font-size:14px;outline:none;color:#fff}
.fin:focus{border-color:var(--mag)}
@media(max-width:560px){.fr{grid-template-columns:1.2fr .9fr 1.2fr 1fr;font-size:12px}.fr>span:nth-child(2),.fr>span:nth-child(4){display:none}}

/* ---------- Performance ---------- */
.est{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:1px;color:var(--amber);border:1px solid #5a4a1f;padding:3px 8px;border-radius:3px}
.perf-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.perf-grid{grid-template-columns:1fr}}
.perf-sec{border-top:3px solid var(--mag);display:flex;flex-direction:column;gap:12px}
.perf-h{display:flex;align-items:center;gap:10px}.perf-h b{letter-spacing:2px;font-size:14px}
.perf-in{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.perf-in .wf input,.perf-in .wf select{padding:8px 9px;font-size:14px}
.vspd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.vspd>div{background:#0c0d10;border:1px solid var(--line);border-radius:4px;padding:8px 10px;text-align:center}
.vspd small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:1px}
.vspd b{font-family:var(--mono);font-size:26px;color:var(--cyan)}
.vspd .thr b{font-size:17px;color:var(--green);line-height:31px}
.vspd .thr.bad b{color:var(--red)}.vspd .thr.warn b{color:var(--amber)}
.ldr{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ldr>div{background:#17181d;border-radius:4px;padding:8px 10px}.ldr small{display:block;font-size:10.5px;color:var(--muted)}.ldr b{font-family:var(--mono);font-size:18px}
.rbar{position:relative;height:22px;background:#17181d;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.rbar i{display:block;height:100%}.rbar i.ok{background:#1f5c40}.rbar i.warn{background:#6b5520}.rbar i.bad{background:#6b2430}
.rbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11.5px;color:#fff}
.perf-note{font-size:11px;color:var(--dim)}

/* ---------- Runway view ---------- */
.rv{margin-top:12px;border-top:3px solid var(--mag)}
.rv-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}.rv-h .muted{margin-left:auto}
.seg2{display:flex;background:#17181d;border-radius:5px;padding:3px}
.seg2 button{border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.5px;padding:7px 10px;border-radius:4px}
.seg2 button.on{background:var(--mag);color:#fff}
.rwy-view{width:100%;height:auto;border-radius:4px;border:1px solid var(--line);display:block}
.rv-info{font-size:12.5px;color:#c9ccd6;margin-top:8px}.rv-info b{color:var(--green)}
.exits{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.ex-h{font-size:12px;font-weight:600}.ex-h .muted{font-weight:400}
.ex-r{display:grid;grid-template-columns:90px 110px 18px auto 30px;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.ex-r input[type=text],.ex-r input:not([type]){background:#15161a;border:1px solid var(--line);border-radius:3px;padding:7px 8px;font-family:var(--mono);font-size:13px;color:#fff;outline:none;width:100%}
.ex-r .ret{display:flex;align-items:center;gap:5px}
.exits .btn{align-self:flex-start;margin-top:4px}

.rwy-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:4px}
@media(max-width:700px){.rwy-scroll .rwy-view{width:720px;max-width:none}}
@media(max-width:560px){.ex-r{grid-template-columns:70px 80px 14px 1fr 26px}}

.pac{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px}
.pac select{background:#15161a;border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-family:var(--mono);font-size:13.5px;color:#fff;outline:none}
.pac-auto{font-size:12.5px;color:var(--muted)}.pac-auto b{color:#fff;font-family:var(--mono)}

.pf-box{margin-top:8px;background:var(--panel);border-radius:4px;padding:8px 12px}
.pf-box label{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.5px;margin-bottom:4px}
.pf-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pf-in{width:80px;background:#15161a;border:1px solid var(--line);border-radius:4px;padding:7px 9px;font-family:var(--mono);font-size:14px;color:#fff;outline:none}
.pf-in:focus{border-color:var(--mag)}
.pf-eff{font-size:11.5px;color:var(--dim);font-family:var(--mono)}

.pf-tog{margin-left:auto;background:none;border:1px solid var(--line);border-radius:14px;color:var(--cyan);font-size:11.5px;font-weight:600;padding:4px 10px}
.pf-tbl{width:100%;border-collapse:separate;border-spacing:0 3px;margin-top:8px;font-size:12.5px}
.pf-tbl th{text-align:left;font-size:10.5px;color:var(--muted);font-weight:600;padding:2px 10px;text-transform:uppercase;letter-spacing:.5px}
.pf-tbl td{background:#17181d;padding:8px 10px;cursor:pointer}
.pf-tbl td:first-child{border-radius:3px 0 0 3px;border-left:3px solid transparent;width:80px}
.pf-tbl td:last-child{border-radius:0 3px 3px 0;width:28px;text-align:center;color:var(--green);font-weight:700}
.pf-tbl td span{color:var(--dim);font-size:11.5px}
.pf-tbl tr:hover td{background:#22242b}
.pf-tbl tr.on td{background:var(--nextbg)}.pf-tbl tr.on td:first-child{border-left-color:var(--mag)}

.revd{display:block;font-size:10.5px;color:var(--green);font-family:var(--mono)}

.pf-mode{margin:4px 0 8px;display:inline-flex}
.pf-auto{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.pf-auto b{color:#fff}
.pf-big{font-size:20px;font-weight:700;color:var(--cyan)}
.pf-lk{color:var(--cyan);font-size:11.5px;text-decoration:none}
.ac-photo .age{font-family:var(--mono);font-size:11.5px;color:var(--amber)}

.mini-btn{display:inline-block;color:var(--cyan)!important;text-decoration:none;font-size:11px!important;font-weight:600;padding:2px 8px!important;border:1px solid #2f4a55;border-radius:12px;margin-left:4px!important;line-height:1.5}

table.ft tr.edit td{padding:4px 2px}
.fe-in{width:90px;background:#15161a;border:1px solid var(--line);border-radius:3px;padding:5px 7px;color:#fff;font-size:13px;text-align:right;outline:none}
.fe-in:focus{border-color:var(--mag)}
.dlt{font-size:10.5px;margin-right:6px;padding:1px 5px;border-radius:3px}
.dlt.up{color:var(--amber);background:#2a2516}.dlt.dn{color:var(--green);background:#14281e}
tr.warnrow td{color:var(--red)!important}
.fe-note{font-size:11.5px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--mono)}


/* ---------- Rank badge & table ---------- */
.rank-badge{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px 5px 6px;flex:none}
.rank-badge svg{display:block}
.rb-t{display:flex;flex-direction:column;line-height:1.1;text-align:left}.rb-t b{font-size:12px;letter-spacing:.8px}.rb-t i{font-style:normal;font-size:10.5px;color:var(--muted);font-family:var(--mono)}
@media(max-width:760px){.rank-badge .rb-t{display:none}.rank-badge{padding:4px}}
.rk-head{display:flex;align-items:center;gap:16px;padding:16px}
.rk-cur small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:1px}.rk-cur b{display:block;font-size:18px}.rk-cur span{font-family:var(--mono);font-size:12.5px;color:var(--cyan)}
.rk-next{padding:0 16px 12px}.rk-bar{height:8px;background:#2a2c33;border-radius:4px;overflow:hidden}.rk-bar i{display:block;height:100%;background:var(--mag)}
.rk-nt{font-size:12.5px;color:var(--muted);margin-top:6px}.rk-nt b{color:#fff}
.rk-wrap{background:#fff;margin:0 12px 14px;border-radius:6px;padding:6px 10px;overflow-x:auto}
.rk-tbl{width:100%;border-collapse:collapse;font-size:13px;color:#111;min-width:460px}
.rk-tbl th{text-align:left;font-weight:500;color:#6b6f7a;font-size:12.5px;padding:10px 8px;border-bottom:1px solid #e6e6ea}
.rk-tbl td{padding:12px 8px;border-bottom:1px solid #e6e6ea;vertical-align:middle}
.rk-tbl td.img{width:84px}.rk-tbl td.img svg{display:block}
.rk-tbl tr.cur td{background:#fff3fa}
.rk-tbl .ok{color:#1f9d63;font-weight:700}

.fs-btn{width:36px;height:36px;flex:none;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--muted)}
.fs-btn.on{color:#fff;border-color:var(--mag)}
:fullscreen .app,:-webkit-full-screen .app{margin:0!important;min-height:100vh!important;border:0!important;border-radius:0!important;max-width:none}
:fullscreen body{background:var(--frame)}

/* immersive mode: no device frame, no margins, compact header */
html.imm .app{margin:0!important;min-height:100vh!important;border:0!important;border-radius:0!important;box-shadow:none!important;max-width:none!important}
html.imm body{background:var(--frame)}
html.imm .top{padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:8px}
html.imm .tabs{top:55px}

/* drawer: touch-scrollable in portrait & landscape */
.drawer{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding-bottom:calc(24px + env(safe-area-inset-bottom));max-height:100vh;max-height:100dvh;scrollbar-width:thin;scrollbar-color:var(--mag) transparent}
.drawer::-webkit-scrollbar{width:6px}.drawer::-webkit-scrollbar-thumb{background:var(--mag);border-radius:4px}
.drawer > *{flex-shrink:0}
html.lock,html.lock body{overflow:hidden}
/* modals too */
.modal{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;max-height:calc(100dvh - 32px)}

.wx-src{font-size:11.5px;margin:0 2px 10px}
.wx-age{font-family:var(--mono);font-size:10.5px;color:var(--green);background:#14281e;padding:2px 7px;border-radius:3px}
.wx-age.old{color:var(--amber);background:#2a2516}

/* ---------- profiles ---------- */
.prof-sel{appearance:none;-webkit-appearance:none;background:none;border:0;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.5px;padding:6px 10px;border-radius:4px;max-width:150px;text-overflow:ellipsis;cursor:pointer}
.prof-sel.on{background:var(--mag);color:#fff}
.prof-sel option{color:#111}
.swatches{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px #0008}
.swatches input[type=color]{width:44px;height:32px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.pchks{display:flex;flex-wrap:wrap;gap:6px}
.pchk{display:flex;align-items:center;gap:6px;background:#17181d;border:1px solid var(--line);border-radius:16px;padding:5px 10px;font-size:12.5px;color:var(--text);margin:0!important}
.frm label .muted{font-weight:400}

/* ---------- checklist / documents switch ---------- */
.vseg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px;margin-bottom:14px}
.vseg button{display:flex;align-items:center;gap:7px;background:none;border:0;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.vseg button svg{width:15px;height:15px}
.vseg button.on{background:var(--mag);color:#fff}

/* ---------- documents library ---------- */
.dv-libhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.dv-libhead b{font-size:17px}.dv-libhead .sp{flex:1}
.dv-imp{cursor:pointer}
.dv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.dv-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.dv-open{background:none;border:0;text-align:left;padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.dv-thumb{height:120px;border-radius:6px;background:#2b2d36 center/cover no-repeat;display:grid;place-items:center;font-weight:800;font-size:22px;letter-spacing:1px;color:#fff}
.dv-thumb.pdf{background:linear-gradient(135deg,#3a3d48,#23252c);color:var(--mag2);border:1px solid #3a3d48}
.dv-thumb.pdf.has{background:#fff top/cover no-repeat;position:relative}
.dv-thumb i{font-style:normal}.dv-thumb.has i{position:absolute;right:6px;bottom:6px;font-size:10px;background:var(--mag);color:#fff;padding:2px 6px;border-radius:4px}
.dv-nm{font-weight:700;font-size:14px;word-break:break-word}
.dv-sub{font-size:11.5px;color:var(--muted)}
.dv-cact{display:flex;border-top:1px solid var(--line)}
.dv-cact button{flex:1;background:none;border:0;padding:10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.dv-cact button+button{border-left:1px solid var(--line)}
.dv-cact .del{color:var(--red)}
.dv-empty{text-align:center;padding:50px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.dv-empty svg{opacity:.6}.dv-empty p{margin:8px 0}

/* ---------- viewer ---------- */
.dv-view{display:flex;flex-direction:column;background:#0b0c0f;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:320px}
.dv-view.max{position:fixed;inset:0;z-index:60;border-radius:0;border:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
html.dv-lock,html.dv-lock body{overflow:hidden}
.dv-bar{display:flex;align-items:center;gap:6px;padding:8px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.dv-bar .sp{flex:1}
.dv-title{font-size:14px;max-width:34vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-b{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 11px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.dv-b.on{background:var(--mag);border-color:var(--mag);color:#fff}
.dv-pg{font-family:var(--mono);min-width:72px;justify-content:center}
.dv-zv{font-family:var(--mono);min-width:62px;justify-content:center}
.dv-grp{display:inline-flex;gap:3px;align-items:center}
.dv-tools{display:none;align-items:center;gap:10px;padding:7px 8px;background:#1a1b21;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dv-view.ann .dv-tools{display:flex}
.dv-t{background:none;border:1px solid transparent;border-radius:6px;padding:5px 9px;display:inline-flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:10.5px;font-weight:600;min-width:52px}
.dv-t.on{background:var(--panel2);border-color:var(--mag);color:#fff}
.dv-t.warn{color:var(--red)}
.dv-cols{gap:6px;padding:0 4px}
.dv-c{width:26px;height:26px;border-radius:50%;background:var(--c);border:2px solid #0b0c0f;box-shadow:0 0 0 1px #555}
.dv-c.on{box-shadow:0 0 0 2px #fff}
.dv-hint{font-size:11px;color:var(--dim);margin-left:auto}
.dv-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative;overscroll-behavior:contain}
.dv-pages{padding:12px;display:flex;flex-direction:column;align-items:center;gap:12px;min-width:100%}
.dv-view.ann .dv-pages{touch-action:none}
.dv-page{position:relative;background:#fff;box-shadow:0 2px 14px #0008;flex:none}
.dv-page canvas,.dv-page img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.dv-ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.dv-ov .hl{mix-blend-mode:multiply}
.dv-note{font-family:Inter,system-ui,sans-serif;font-weight:600;paint-order:stroke;stroke:#fffc;stroke-width:3px}
.dv-view.ann .dv-page{cursor:crosshair}
.dv-pn{position:absolute;right:-2px;bottom:-20px;font-size:10.5px;color:var(--dim);font-family:var(--mono)}
.dv-load{padding:40px;text-align:center;color:var(--muted)}
.dv-menu{display:flex;flex-direction:column;padding:8px}
.dv-menu button{background:none;border:0;text-align:left;padding:14px 12px;font-size:15px;border-radius:8px}
.dv-menu button:active{background:var(--panel2)}
.dv-menu .warn{color:var(--red)}
.dv-sizes{display:flex;gap:6px;align-items:center;margin-top:10px}
.dv-sizes button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 14px;font-weight:700}
.dv-sizes button.on{background:var(--mag);border-color:var(--mag);color:#fff}
@media(max-width:700px){.dv-t span{display:none}.dv-t{min-width:40px;padding:8px}.dv-hint{display:none}.dv-title{max-width:28vw}}

/* iPad Safari: date inputs keep a native min-width and overflow their grid cell */
.fld,.frm>div{min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;width:100%;min-height:42px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
.fld input.big+*,.fld input[type=date]{box-sizing:border-box}

/* standalone app: full bleed + safe areas */
.app{margin:0!important;min-height:100vh;border:0!important;border-radius:0!important;box-shadow:none!important;max-width:none}
.top{padding-top:calc(10px + env(safe-area-inset-top));padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right))}
main{padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right));padding-bottom:calc(60px + env(safe-area-inset-bottom))}
.tabs{top:calc(58px + env(safe-area-inset-top))}
#fsBtn{display:none}
@media (display-mode: browser){#fsBtn{display:grid}}
</style>
</head>

/* ---- storage (IndexedDB: survives app restarts, handles big files) ---- */
let _docDb;
function docDb(){ return _docDb||(_docDb=new Promise((res,rej)=>{ const r=indexedDB.open("efb-docs",1);
  r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains("files")) d.createObjectStore("files"); if(!d.objectStoreNames.contains("meta")) d.createObjectStore("meta",{keyPath:"id"}); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>{ _docDb=null; rej(r.error); }; })); }
async function idb(store,mode,fn){ const d=await docDb(); return new Promise((res,rej)=>{ const t=d.transaction(store,mode), r=fn(t.objectStore(store)); let out;
  if(r) r.onsuccess=()=>{ out=r.result; }; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); }
const docMetaAll=()=>idb("meta","readonly",s=>s.getAll());
const docMetaPut=m=>idb("meta","readwrite",s=>s.put(m));
const docFileGet=id=>idb("files","readonly",s=>s.get(id));
const docFilePut=(id,buf)=>idb("files","readwrite",s=>s.put(buf,id));
async function docRemove(id){ await idb("meta","readwrite",s=>s.delete(id)); await idb("files","readwrite",s=>s.delete(id)); }
let _docSaveT; function docSaveMeta(){ clearTimeout(_docSaveT); const m=DOCS.cur; _docSaveT=setTimeout(()=>{ if(m) docMetaPut(m).catch(()=>toast("Could not save annotations")); },350); }

let _pdfjs;
function pdfjs(){ return _pdfjs||(_pdfjs=import("./pdf.min.mjs").then(m=>{ m.GlobalWorkerOptions.workerSrc="./pdf.worker.min.mjs"; return m; }).catch(e=>{ _pdfjs=null; throw e; })); }

const fmtSize=b=>b>1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" kB";

async function docImport(files){
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  let n=0;
  for(const f of files){
    const isPdf=f.type==="application/pdf"||/\.pdf$/i.test(f.name), isImg=(f.type||"").startsWith("image/")||/\.(png|jpe?g|gif|webp|heic|heif)$/i.test(f.name);
    if(!isPdf&&!isImg){ toast(`${f.name}: not a PDF or an image`); continue; }
    toast(`Importing ${f.name}…`);
    try{
      const buf=await f.arrayBuffer(); let pages=1, thumb="";
      if(isPdf){ const lib=await pdfjs(); const lt=lib.getDocument({data:new Uint8Array(buf.slice(0))}); const pd=await lt.promise; pages=pd.numPages;
        try{ const p1=await pd.getPage(1), v0=p1.getViewport({scale:1}), vp=p1.getViewport({scale:360/v0.width}), c=document.createElement("canvas"); c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
          const cx=c.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,c.width,c.height); await p1.render({canvasContext:cx,viewport:vp}).promise; thumb=c.toDataURL("image/jpeg",0.7); }catch(_){}
        lt.destroy().catch(()=>{}); }
      const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      await docFilePut(id,buf);
      await docMetaPut({id,name:(f.name||"Document").replace(/\.[^.]+$/,"")||"Document",kind:isPdf?"pdf":"img",mime:f.type||(isPdf?"application/pdf":"image/jpeg"),size:f.size,pages,thumb,added:Date.now(),last:1,ann:{}});
      n++;
    }catch(e){ console.error("doc import",e); toast(isPdf?`${f.name}: can't open this PDF${/import|fetch|module/i.test(String(e))?" (PDF engine missing — upload pdf.min.mjs & pdf.worker.min.mjs)":""}`:`${f.name}: import failed`); }
  }
  if(n) toast(`${n} document${n>1?"s":""} imported`);
  docLibrary();
}

function docBuildPages(){
  const box=DOCS.root.querySelector(".dv-pages"); const m=DOCS.cur;

  box.querySelectorAll(".dv-page").forEach(pg=>{ DOCS.obs.observe(pg); docDrawAnn(pg); });

}
function docBaseW(){ return Math.max(200,DOCS.scroller.clientWidth-24); }
function docLayout(rerender){

  const W=docBaseW()*DOCS.zoom, box=DOCS.root.querySelector(".dv-pages"); if(!box) return;
  box.style.width=Math.max(W+24,DOCS.scroller.clientWidth)+"px";
  box.querySelectorAll(".dv-page").forEach(pg=>{ const [w,h]=DOCS.sizes[pg.dataset.p-1]; pg.style.width=W+"px"; pg.style.height=Math.round(W*h/w)+"px"; if(rerender&&pg._vis) docRenderPage(pg,true); });
  const zv=$("#dvFit"); if(zv) zv.textContent=Math.round(DOCS.zoom*100)+"%";
}
function docZoom(z,anchor){
  z=Math.max(0.5,Math.min(5,z)); if(!DOCS.scroller) return;
  const sc=DOCS.scroller, old=DOCS.zoom, k=z/old;
  const ax=anchor?anchor[0]:sc.clientWidth/2, ay=anchor?anchor[1]:sc.clientHeight/3;
  const cx=sc.scrollLeft+ax, cy=sc.scrollTop+ay;
  DOCS.zoom=z; if(DOCS.cur){ DOCS.cur.zoom=z; docSaveMeta(); }

}
async function docRenderPage(pg,force){
  if(DOCS.cur&&DOCS.cur.kind==="img") return;

  const cv=pg.querySelector("canvas"); const cssW=pg.clientWidth; if(!cssW) return;
  const dpr=Math.min(window.devicePixelRatio||1,3), [w,h]=DOCS.sizes[pg.dataset.p-1];
  let pxW=cssW*dpr; const maxArea=12e6; if(pxW*pxW*h/w>maxArea) pxW=Math.sqrt(maxArea*w/h);
  pxW=Math.floor(pxW);
  if(!force&&pg._rw===pxW) return;
  pg._rw=pxW;
  if(pg._task){ try{ pg._task.cancel(); }catch(e){} }
  try{
    const page=await pdf.getPage(+pg.dataset.p); if(pdf!==DOCS.pdf) return;
    const vp=page.getViewport({scale:pxW/w});
    const off=document.createElement("canvas"); off.width=Math.floor(vp.width); off.height=Math.floor(vp.height);
    const task=page.render({canvasContext:off.getContext("2d"),viewport:vp}); pg._task=task; await task.promise; pg._task=null;

}
function docFreePage(pg){ const cv=pg.querySelector("canvas"); if(!cv) return; if(pg._task){ try{ pg._task.cancel(); }catch(e){} pg._task=null; } cv.width=0; cv.height=0; pg._rw=0; }

function docItemSvg(it){

  if(it.t==="u"||it.t==="p") return `<polyline points="${pts}" fill="none" stroke="${it.c}" stroke-width="${it.w}" stroke-linecap="round" stroke-linejoin="round"/>`;

function docDrawAnn(pg){ const sv=pg.querySelector(".dv-ov"); const a=(DOCS.cur.ann[pg.dataset.p])||[]; sv.innerHTML=a.map(docItemSvg).join(""); }

function docCommit(p,next){

}
function docUndo(){ const h=DOCS.hist.pop(); if(!h){ toast("Nothing to undo"); return; } const m=DOCS.cur;
  if(h.all){ DOCS.fut.push({all:JSON.parse(JSON.stringify(m.ann))}); m.ann=h.all; docSaveMeta(); docRedrawAll(); return; }
  DOCS.fut.push({p:h.p,before:(m.ann[h.p]||[]).slice()}); if(h.before.length) m.ann[h.p]=h.before; else delete m.ann[h.p]; docSaveMeta();
  const pg=DOCS.root.querySelector(`.dv-page[data-p="${h.p}"]`); if(pg) docDrawAnn(pg); }
function docRedo(){ const h=DOCS.fut.pop(); if(!h){ toast("Nothing to redo"); return; } const m=DOCS.cur;
  if(h.all){ DOCS.hist.push({all:JSON.parse(JSON.stringify(m.ann))}); m.ann=h.all; docSaveMeta(); docRedrawAll(); return; }
  DOCS.hist.push({p:h.p,before:(m.ann[h.p]||[]).slice()}); if(h.before.length) m.ann[h.p]=h.before; else delete m.ann[h.p]; docSaveMeta();
  const pg=DOCS.root.querySelector(`.dv-page[data-p="${h.p}"]`); if(pg) docDrawAnn(pg); }
function docPt(pg,e){ const r=pg.getBoundingClientRect(), H=+pg.querySelector(".dv-ov").dataset.h; return [Math.round((e.clientX-r.left)/r.width*1000*10)/10, Math.round((e.clientY-r.top)/r.height*H*10)/10]; }
function segDist(p,a,b){ const dx=b[0]-a[0], dy=b[1]-a[1], L=dx*dx+dy*dy; let t=L?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L:0; t=Math.max(0,Math.min(1,t)); const x=a[0]+t*dx-p[0], y=a[1]+t*dy-p[1]; return Math.sqrt(x*x+y*y); }
function docHit(it,p,tol){
  if(it.t==="x"){ const L=String(it.s).split("\n"), w=Math.max(...L.map(l=>l.length))*it.fs*0.58; return p[0]>=it.x-tol&&p[0]<=it.x+w+tol&&p[1]>=it.y-it.fs-tol&&p[1]<=it.y+(L.length-1)*it.fs*1.2+tol; }
  const d=it.d; if(d.length===1) return Math.hypot(p[0]-d[0][0],p[1]-d[0][1])<=tol+it.w/2;
  for(let i=1;i<d.length;i++) if(segDist(p,d[i-1],d[i])<=tol+it.w/2) return true; return false;
}
function docTextAt(pg,pt){

function docBindDraw(box){
  const ptrs=new Map(); let cur=null, scrollMid=null;
  const mid=()=>{ const a=[...ptrs.values()]; return [(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2]; };
  const cancel=()=>{ if(cur){ if(cur.el) cur.el.remove(); cur=null; } };
  box.addEventListener("pointerdown",e=>{
    if(DOCS.mode!=="ann") return;
    if(e.pointerType==="mouse"&&e.button!==0) return;
    ptrs.set(e.pointerId,[e.clientX,e.clientY]);
    if(ptrs.size>=2){ cancel(); scrollMid=mid(); return; }
    const pg=e.target.closest(".dv-page"); if(!pg) return;
    e.preventDefault(); try{ box.setPointerCapture(e.pointerId); }catch(_){}
    const p=docPt(pg,e), T=DOCS.tool;
    if(T==="txt"){ cur={T,pg,start:p,id:e.pointerId}; return; }
    if(T==="era"){ cur={T,pg,id:e.pointerId,removed:false,before:(DOCS.cur.ann[pg.dataset.p]||[]).slice()}; docErase(cur,p); return; }
    const w=T==="hl"?22:T==="ul"?3:3.2;
    const el=document.createElementNS("http://www.w3.org/2000/svg","polyline");
    el.setAttribute("fill","none"); el.setAttribute("stroke",DOCS.color); el.setAttribute("stroke-width",w); el.setAttribute("stroke-linecap","round"); el.setAttribute("stroke-linejoin","round");
    if(T==="hl") el.setAttribute("stroke-opacity",".38");
    pg.querySelector(".dv-ov").appendChild(el);
    cur={T,pg,el,w,d:[p],id:e.pointerId}; el.setAttribute("points",p.join(","));
  });

    if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId,[e.clientX,e.clientY]);
    if(ptrs.size>=2&&scrollMid){ const m=mid(); DOCS.scroller.scrollBy(scrollMid[0]-m[0],scrollMid[1]-m[1]); scrollMid=m; return; }
    if(!cur||cur.id!==e.pointerId) return; e.preventDefault();
    const p=docPt(cur.pg,e);
    if(cur.T==="era"){ docErase(cur,p); return; }
    if(cur.T==="txt") return;
    const l=cur.d[cur.d.length-1]; if(Math.hypot(p[0]-l[0],p[1]-l[1])<1.5) return;
    cur.d.push(p);
    let shown=cur.d;
    if(cur.T==="ul"||cur.T==="hl"){ const s=docStraight(cur); if(s) shown=s; }
    cur.el.setAttribute("points",shown.map(q=>q.join(",")).join(" "));
  });
  const end=e=>{
    ptrs.delete(e.pointerId); if(ptrs.size<2) scrollMid=null;
    if(!cur||cur.id!==e.pointerId) return;
    const c=cur; cur=null; const p=c.pg.dataset.p;
    if(e.type==="pointercancel"){ if(c.el) c.el.remove(); if(c.T==="era"&&c.removed) docDrawAnn(c.pg); return; }
    if(c.T==="txt"){ docTextAt(c.pg,c.start); return; }
    if(c.T==="era"){ if(c.removed){ const now=(DOCS.cur.ann[p]||[]).slice(); DOCS.cur.ann[p]=c.before; docCommit(p,now); } return; }
    c.el.remove();
    let d=c.d; if(c.T==="ul"||c.T==="hl"){ d=docStraight(c)||(c.T==="ul"?null:d); if(!d){ toast("Underline: draw a line along the text"); return; } }
    if(c.T==="pen"&&d.length===1) d=[d[0],[d[0][0]+0.1,d[0][1]]];
    if(c.T!=="pen"&&d.length<2) return;
    docCommit(p,[...(DOCS.cur.ann[p]||[]),{t:c.T==="hl"?"h":c.T==="ul"?"u":"p",c:DOCS.color,w:c.w,d:docSimplify(d)}]);
  };
  box.addEventListener("pointerup",end); box.addEventListener("pointercancel",end);
}
function docStraight(c){
  const d=c.d; if(d.length<2) return null; const xs=d.map(q=>q[0]), ys=d.map(q=>q[1]);
  const dx=Math.max(...xs)-Math.min(...xs), dy=Math.max(...ys)-Math.min(...ys);
  if(dx<4) return null;

}
function docSimplify(d){ if(d.length<4) return d; const out=[d[0]]; for(let i=1;i<d.length-1;i++){ const l=out[out.length-1]; if(Math.hypot(d[i][0]-l[0],d[i][1]-l[1])>=2.5) out.push(d[i]); } out.push(d[d.length-1]); return out; }
function docErase(c,p){
  const k=c.pg.dataset.p, a=DOCS.cur.ann[k]; if(!a||!a.length) return;
  const keep=a.filter(it=>!docHit(it,p,12)); if(keep.length!==a.length){ c.removed=true; if(keep.length) DOCS.cur.ann[k]=keep; else delete DOCS.cur.ann[k]; docDrawAnn(c.pg); }
}
function docBindPinch(){
  const sc=DOCS.scroller, box=DOCS.root.querySelector(".dv-pages"); let st=null;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  sc.addEventListener("touchstart",e=>{ if(e.touches.length===2){ const r=sc.getBoundingClientRect(); st={d:dist(e.touches),z:DOCS.zoom,ax:(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,ay:(e.touches[0].clientY+e.touches[1].clientY)/2-r.top,k:1}; } },{passive:true});
  sc.addEventListener("touchmove",e=>{ if(!st||e.touches.length!==2) return; if(DOCS.mode==="ann"){ st=null; return; } e.preventDefault();

const IS_SA=(typeof STANDALONE!=="undefined"&&STANDALONE);

  checklist:{c:{}, sec:{}, sel:""},
  settings: {pilot:"Pilot", mode:"wizz", sb:""},
  ofp:      {sum:null, text:"", at:""},
  wx:       {live:{}, extra:""},
  wind:     {rwy:"", wd:"", ws:"", gust:"", rwycc:"6", xlim:"38", tlim:"10"},
  fuel:     {ofpAt:"", act:{}},
  perf:     {to:{}, ldg:{}},
  rwys:     {db:{}, view:"ldg"},

};
const S = JSON.parse(JSON.stringify(DEFAULTS));
const LS = "efb_a320_v1_";
let db=null, uid=null;
function lsGet(k){try{const v=localStorage.getItem(LS+k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}}
const TYPE_FIX={"A321-200":"A321ceo","A320-200":"A320ceo","A319-100":"A319ceo"};
function normalizeTypes(){ let ch=false; (S.flights.list||[]).forEach(f=>{ if(TYPE_FIX[f.type]){ f.type=TYPE_FIX[f.type]; ch=true; } }); if(ch) save("flights"); }
function applyLogImports(){
  const fl=S.flights; fl.applied=fl.applied||[]; let changed=false;
  (typeof LOG_IMPORTS!=="undefined"?LOG_IMPORTS:[]).forEach(b=>{
    if(fl.applied.includes(b.id)) return;
    (b.fixes||[]).forEach(([d,oldCs,newCs])=>{const x=fl.list.find(f=>f.date===d&&f.cs===oldCs); if(x){x.cs=newCs;}});
    const key=f=>f.date+"|"+(f.cs||"").toUpperCase();
    const have=new Set(fl.list.map(key));
    b.flights.forEach(([d,cs,sec],i)=>{ if(!have.has(d+"|"+cs)){ fl.list.push({id:b.id+"-"+i,date:d,cs,type:"",eng:"",reg:"",from:"",to:"",dep:"",arr:"",dur:sec,rmk:""}); have.add(d+"|"+cs);} });
    fl.applied.push(b.id); changed=true;
  });
  if(changed) save("flights");
}
function migrate(){
  // v1 -> v2 data shapes
  const b=S.briefing; b.hdr=b.hdr||{}; b.hdr.w=b.hdr.w||{}; b.hdr.g=b.hdr.g||{};
  if(b.hdr.type&&!b.hdr.w.type){b.hdr.w.legacy=b.hdr.type; delete b.hdr.type}
  if(b.hdr.reg&&!b.hdr.w.reg){b.hdr.w.reg=b.hdr.reg; delete b.hdr.reg}
  const c=S.checklist;
  if(typeof c.sec!=="object"||c.sec===null) c.sec={a320:+c.sec||0};
  Object.keys(c.c||{}).forEach(k=>{ if(!k.includes(":")){ c.c["a320:"+k]=c.c[k]; delete c.c[k]; } });
  if(!S.settings.mode) S.settings.mode="wizz";
  if(String(S.settings.mode).startsWith("p:")) S.settings.mode="global";
  delete S.settings.profiles;
  Object.keys(CHECKLISTS).forEach(id=>{ const v=CHECKLISTS[id].v||1; c.ver=c.ver||{};
    if((c.ver[id]||1)!==v){ Object.keys(c.c).forEach(k=>{if(k.startsWith(id+":"))delete c.c[k]}); c.sec[id]=0; c.ver[id]=v; } });
}
for(const k in DEFAULTS){const v=lsGet(k); if(v) S[k]=Object.assign({},DEFAULTS[k],v);}
migrate();

const timers={}, writing={}, dirty={};
function save(k){ lsSet(k,S[k]); clearTimeout(timers[k]); timers[k]=setTimeout(()=>flush(k),700); }
async function flush(k){
  if(!db||!uid) return;
  if(writing[k]){dirty[k]=true;return;}
  writing[k]=true;
  try{ await db.doc(`data/users/${uid}/${k}`).set(JSON.parse(JSON.stringify(S[k]))); setSync(true); }
  catch(e){ setSync(false); }
  writing[k]=false;
  if(dirty[k]){dirty[k]=false;flush(k);}
}
function setSync(ok){
  const el=document.getElementById("stSync");
  el.textContent= ok ? "☁ Sync OK" : "☁ Local";
  el.className = "sync"+(ok?"":" local");
}
applyLogImports(); normalizeTypes();
async function connect(){
  try{
    if(IS_SA){ setSync(false); const e=document.getElementById("stSync"); if(e) e.textContent="⛁ On device"; return; }
    if(!window.claude||!claude.use) return;
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!d||!u) return;
    const id=await u.id(); if(!id) return;
    db=d; uid=id;
    const keys=Object.keys(DEFAULTS);
    const timeout=new Promise(r=>setTimeout(()=>r("timeout"),10000));
    const res=await Promise.race([Promise.all(keys.map(k=>db.doc(`data/users/${uid}/${k}`).get())),timeout]);
    if(res==="timeout"){setSync(false);return;}
    res.forEach((snap,i)=>{
      const k=keys[i];
      if(snap.exists){ S[k]=Object.assign({},DEFAULTS[k],JSON.parse(JSON.stringify(snap.data()))); lsSet(k,S[k]); }
      else if(lsGet(k)){ flush(k); }
    });
    migrate(); applyLogImports(); normalizeTypes(); applyMode(); setSync(true); render();
  }catch(e){ setSync(false); }
}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"_");
function mins(dep,arr){
  const p=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(t||"");return m?(+m[1])*60+(+m[2]):null};
  const a=p(dep),b=p(arr); if(a==null||b==null) return 0;
  let d=b-a; if(d<0) d+=1440; return d;
}
function blockMin(f){ if(f.dep&&f.arr) return mins(f.dep,f.arr); if(f.dur) return Math.round(+f.dur/60); return 0; }
const hhmm=m=>`${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`;
const fdate=iso=>{if(!iso)return"";const [y,m,d]=iso.split("-");return `${d}/${m}/${y.slice(2)}`};
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200)}
function openModal(html){$("#modal").innerHTML=html;$("#scrim").classList.add("show")}
function closeModal(){$("#scrim").classList.remove("show")}
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeModal()});
function confirmBox(title,text,okLabel,onOk){
  openModal(`<div class="modal-h"><h3>${esc(title)}</h3><button class="x" data-close>×</button></div>
    <div class="confirm-txt">${esc(text)}</div>
    <div class="modal-f"><span class="sp"></span><button class="btn ghost" data-close>Cancel</button><button class="btn mag" id="okBtn">${esc(okLabel)}</button></div>`);
  $("#modal").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);
  $("#okBtn").onclick=()=>{closeModal();onOk()};
}

function photoLinks(reg){
  reg=(reg||"").trim().toUpperCase(); if(!reg||reg.length<3) return "";

  const y=acYear(reg); const ag=y?`<span class="age">built ${y.year} · ${Math.max(0,NOW_YEAR-y.year)} yrs${y.src.startsWith("est")?" (est.)":""}</span>`:`<button class="pf-tog" data-yedit="${esc(reg)}">+ year built</button>`;
  return `<div class="ac-photo"><span class="cam">📷</span><span>Photos of <b>${esc(reg)}</b></span>${ag}

    <a href="https://www.planespotters.net/search?q=${r}" target="_blank" rel="noopener">Planespotters ↗</a>${afLink(reg)}</div>`;

const opt=(v,label,sel)=>`<option value="${esc(v)}" ${v===sel?"selected":""}>${esc(label??v)}</option>`;
function regSelectHTML(type,sel){
  const groups=WIZZ_FLEET.map(g=>{
    const list=g.list.filter(([r,c])=>!type||MODEL[c][0]===type);
    if(!list.length) return "";
    return `<optgroup label="${esc(g.aoc)} (${list.length})">${list.map(([r])=>opt(r,r,sel)).join("")}</optgroup>`;
  }).join("");
  const known=!sel||REG_INDEX[sel];
  return `<option value="">— select —</option>${groups}<option value="__other" ${!known?"selected":""}>Other (type in)…</option>`;
}
function allTypeOptions(sel){
  let found=false;
  const groups=FAMILIES.map(f=>`<optgroup label="${esc(f.name)}">${f.variants.map(x=>{if(x.v===sel)found=true;return opt(x.v,x.v,sel)}).join("")}</optgroup>`).join("");
  return (sel&&!found?opt(sel,sel+" (legacy)",sel):"")+`<option value="">— type —</option>`+groups;

function briefFieldKeys(sec){
  const out=[];
  sec.fields.forEach(f=>{ if(typeof f==="string") out.push(sec.id+"."+slug(f)); else f.tri.forEach(t=>out.push(sec.id+"."+slug(t))); });
  return out;
}
function briefProgress(sec){const ks=briefFieldKeys(sec);return [ks.filter(k=>(S.briefing.f[k]||"").trim()).length,ks.length]}
function briefTotals(){let a=0,b=0;BRIEFING.forEach(s=>{const [x,y]=briefProgress(s);a+=x;b+=y});return [a,b]}

    $("#cp").onclick=()=>navigator.clipboard.writeText(t).then(()=>toast("Copied")).catch(()=>{$(".copybox").select();toast("Select all & copy")});

  $("#bLog").onclick=()=>{const ac=currentAc();flightForm(null,{date:h.date||"",type:ac.type,eng:ac.eng,reg:ac.reg,cs:h.cs||"",from:h.from||"",to:h.to||""})};

function briefingText(){
  const h=S.briefing.hdr, f=S.briefing.f, ac=currentAc();
  let t=`${h.cs||"----"}  ${h.from||"----"} → ${h.to||"----"}  ${h.date?fdate(h.date):""}\n${ac.type} ${ac.eng?"("+ac.eng+")":""} ${ac.reg}\n`;
  BRIEFING.forEach(sec=>{
    t+=`\n${sec.title.toUpperCase()} — ${sec.role}\n`;
    sec.fields.forEach(fd=>{
      if(typeof fd==="string") t+=`  ${fd}: ${f[sec.id+"."+slug(fd)]||"—"}\n`;
      else t+=`  ${fd.k}: ${fd.tri.map(x=>f[sec.id+"."+slug(x)]||"—").join(" / ")}\n`;
    });
  });
  return t;
}

/* ================= MODULE: CHECKLIST ================= */
function activeCl(){
  if(isWizz()) return "a320";
  if(S.checklist.sel&&CHECKLISTS[S.checklist.sel]&&clAllowed(S.checklist.sel)) return S.checklist.sel;
  const fam=FAMILIES.find(f=>f.id===currentAc().fam); if(fam&&clAllowed(fam.cl)) return fam.cl;
  return Object.keys(CHECKLISTS).find(clAllowed)||"a320";
}
function clItems(cl,si){return CHECKLISTS[cl].sections[si].i.map((raw,ii)=>{
  const id=`${cl}:${si}_${ii}`;
  if(raw[0]===">") return {id,kind:"banner",text:raw.slice(1)};
  if(raw[0]==="#") return {id,kind:"sub",text:raw.slice(1)};
  if(raw[0]==="!") return {id,kind:"info",text:raw.slice(1)};
  if(raw[0]==="~") return {id,kind:"action",lbl:raw.slice(1)};
  const [l,v]=raw.split("|"); return {id,kind:"item",lbl:l,val:v};
})}
const checkable=x=>x.kind==="item"||x.kind==="action";
function clProgress(cl,si){const it=clItems(cl,si).filter(checkable);return [it.filter(x=>S.checklist.c[x.id]).length,it.length]}
function clTotals(cl){let a=0,b=0;CHECKLISTS[cl].sections.forEach((_,i)=>{const [x,y]=clProgress(cl,i);a+=x;b+=y});return [a,b]}
function tagLabel(l){
  return esc(l).replace(/^\[AT\]\s*/,'<span class="tag at">AT</span>').replace(/^\[NO AT\]\s*/,'<span class="tag noat">NO AT</span>').replace(/^\[GPU\]\s*/,'<span class="tag gpu">GPU</span>');
}

  const v=S.checklist.view==="docs"?"docs":"cl";
  const h=`<div class="vseg"><button data-v="cl" class="${v==="cl"?"on":""}">${ICON.check}Checklists</button><button data-v="docs" class="${v==="docs"?"on":""}">${docSvg("M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9zM14 3v6h6M8 13h8M8 17h5",16)}Documents</button></div>`;
  return [h,()=>el.querySelectorAll(".vseg button").forEach(b=>b.onclick=()=>{ if(S.checklist.view===b.dataset.v) return; S.checklist.view=b.dataset.v; save("checklist"); render(); window.scrollTo({top:0}); })];
}
function renderChecklist(el){

/* ================= MODULE: SIMBRIEF OFP ================= */
const ICAO_MAP={A318:"A318",A319:"A319ceo",A19N:"A319neo",A320:"A320ceo",A20N:"A320neo",A321:"A321ceo",A21N:"A321neo",
  BCS1:"A220-100",BCS3:"A220-300",B736:"737-600",B737:"737-700",B738:"737-800",B739:"737-900",
  B752:"757-200",B753:"757-300",B772:"777-200ER",B77L:"777-200LR",B773:"777-300",B77W:"777-300ER"};

function xmlToObj(node){
  const kids=[...node.children];
  if(!kids.length) return node.textContent;
  const o={};
  kids.forEach(k=>{const v=xmlToObj(k); if(k.tagName in o){ if(!Array.isArray(o[k.tagName])) o[k.tagName]=[o[k.tagName]]; o[k.tagName].push(v);} else o[k.tagName]=v;});
  return o;
}
function parseOfpInput(txt){
  txt=(txt||"").trim().replace(/^﻿/,"");
  if(!txt) throw new Error("Nothing to import — paste the OFP first.");
  let o;
  if(txt[0]==="{"){ o=JSON.parse(txt); }
  else if(txt[0]==="<"){
    const doc=new DOMParser().parseFromString(txt,"application/xml");
    if(doc.querySelector("parsererror")) throw new Error("This doesn't look like valid SimBrief XML.");
    o=xmlToObj(doc.documentElement);
  } else throw new Error("Paste the SimBrief JSON (starts with {) or XML (starts with <).");
  if(o.OFP) o=o.OFP;
  if(o.fetch&&o.fetch.status&&String(o.fetch.status)!=="Success") throw new Error("SimBrief says: "+o.fetch.status);
  if(!o.origin||!o.destination) throw new Error("No flight found in this data — generate a flight on SimBrief first.");
  return o;
}
const gv=(o,path)=>{let x=o;for(const p of path.split(".")){if(x==null)return "";x=x[p]}return (x==null||typeof x==="object")?"":String(x)};
const secHM=s=>{s=+s;if(!s)return "";const m=Math.round(s/60);return `${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`};
const unixHM=u=>{u=+u;if(!u)return "";const d=new Date(u*1000);return `${String(d.getUTCHours()).padStart(2,"0")}:${String(d.getUTCMinutes()).padStart(2,"0")}`};
const unixDate=u=>{u=+u;if(!u)return "";return new Date(u*1000).toISOString().slice(0,10)};
const num=v=>v===""?"":Number(v).toLocaleString("en-US");

function summarizeOfp(o){
  const fixes=(o.navlog&&o.navlog.fix)?[].concat(o.navlog.fix):[];
  const ss=fixes.filter(f=>String(f.is_sid_star)==="1");
  const firstEnroute=fixes.findIndex(f=>String(f.is_sid_star)!=="1");
  const sid=ss.length&&fixes.indexOf(ss[0])<firstEnroute?gv(ss[0],"via_airway"):"";
  const lastSS=ss.length?ss[ss.length-1]:null;
  const star=lastSS&&fixes.indexOf(lastSS)>firstEnroute?gv(lastSS,"via_airway"):"";
  const icao=gv(o,"aircraft.icaocode")||gv(o,"aircraft.icao_code");
  let variant=ICAO_MAP[icao]||"";
  const acname=gv(o,"aircraft.name");
  if(icao==="A21N"&&/XLR/i.test(acname)) variant="A321XLR"; else if(icao==="A21N"&&/\bLR\b/i.test(acname)) variant="A321LR";
  const engRaw=gv(o,"aircraft.engines");
  let eng="";
  if(variant&&engRaw){ const n=engRaw.toUpperCase().replace(/\s/g,""); eng=enginesFor(variant).find(e=>e.toUpperCase().replace(/\s/g,"").includes(n)||n.includes(e.split(" ")[0].toUpperCase()))||engRaw; }
  const cs=gv(o,"atc.callsign")||(gv(o,"general.icao_airline")+gv(o,"general.flight_number"));
  return {
    cs, airline:gv(o,"general.icao_airline"), fltnum:gv(o,"general.flight_number"),
    from:gv(o,"origin.icao_code"), fromName:gv(o,"origin.name"), depElev:gv(o,"origin.elevation"), arrElev:gv(o,"destination.elevation"), depRwy:gv(o,"origin.plan_rwy"),
    to:gv(o,"destination.icao_code"), toName:gv(o,"destination.name"), arrRwy:gv(o,"destination.plan_rwy"),
    altn:gv(o,"alternate.icao_code"), altnRwy:gv(o,"alternate.plan_rwy"),
    sid, star, route:gv(o,"general.route")||gv(o,"atc.route"),
    fl:gv(o,"general.initial_altitude"), ci:gv(o,"general.costindex"), dist:gv(o,"general.route_distance")||gv(o,"general.air_distance"),
    wind:gv(o,"general.avg_wind_comp"), icao, acname, reg:gv(o,"aircraft.reg"), variant, eng, engRaw,
    units:gv(o,"params.units")||"kgs",
    fuel:{taxi:gv(o,"fuel.taxi"),trip:gv(o,"fuel.enroute_burn"),cont:gv(o,"fuel.contingency"),altn:gv(o,"fuel.alternate_burn"),
          fres:gv(o,"fuel.reserve"),extra:gv(o,"fuel.extra"),mintof:gv(o,"fuel.min_takeoff"),tof:gv(o,"fuel.plan_takeoff"),
          ramp:gv(o,"fuel.plan_ramp"),ldg:gv(o,"fuel.plan_landing")},
    wt:{zfw:gv(o,"weights.est_zfw"),tow:gv(o,"weights.est_tow"),ldw:gv(o,"weights.est_ldw"),payload:gv(o,"weights.payload"),
        pax:gv(o,"weights.pax_count"),mzfw:gv(o,"weights.max_zfw"),mtow:gv(o,"weights.max_tow"),mlw:gv(o,"weights.max_ldw")},
    t:{out:unixHM(gv(o,"times.sched_out")),off:unixHM(gv(o,"times.sched_off")),on:unixHM(gv(o,"times.sched_on")),in:unixHM(gv(o,"times.sched_in")),
       ete:secHM(gv(o,"times.est_time_enroute")),block:secHM(gv(o,"times.est_block")),date:unixDate(gv(o,"times.sched_out"))},
    metar:{dep:gv(o,"origin.metar"),arr:gv(o,"destination.metar"),altn:gv(o,"alternate.metar")},
    taf:{dep:gv(o,"origin.taf"),arr:gv(o,"destination.taf")},
    nav:fixes.filter(f=>String(f.is_sid_star)!=="1"||/^(TOC|TOD)$/i.test(gv(f,"ident"))).slice(0,150).map(f=>({id:gv(f,"ident"),awy:gv(f,"via_airway"),alt:gv(f,"altitude_feet"),t:gv(f,"time_total"),fob:gv(f,"fuel_plan_onboard"),min:gv(f,"fuel_min_onboard")}))
  };
}
function ofpText(o){
  const h=gv(o,"text.plan_html"); if(!h) return "";
  const marked=h.replace(/<br\s*\/?>/gi,"\n").replace(/<(h\d|div|p)[^>]*page-break[^>]*>/gi,"\n\u000c\n");
  const d=new DOMParser().parseFromString(marked,"text/html");
  return (d.body.textContent||"").replace(/[ \t]+\n/g,"\n").replace(/\n{4,}/g,"\n\n\n").trim().slice(0,180000);
}
const OFP_KEYS=["ATC FLIGHT PLAN","FLIGHT PLAN","OPERATIONAL FLIGHT PLAN","OFP","FUEL","ROUTE","NAVLOG","NAV LOG","FLIGHT LOG","WIND","WEATHER","METAR","TAF","NOTAM","SIGMET","ALTERNATE","DEPARTURE","ARRIVAL","DESTINATION","ORIGIN","TAKEOFF","TAKE-OFF","LANDING","TLR","WEIGHT","MASS","LOADSHEET","LOAD","ETOPS","ENROUTE","EN-ROUTE","EN ROUTE","DISPATCH","REMARKS","PERFORMANCE","AIRPORT","MEL","COMPANY","CREW","SUMMARY","TIMES","IMPACT","OPTIONS"];
function ofpHeading(line){
  const t=line.trim(); if(t.length<3||t.length>52) return "";
  const letters=(t.match(/[A-Z]/g)||[]).length, lower=(t.match(/[a-z]/g)||[]).length, digits=(t.match(/\d/g)||[]).length;
  if(lower>letters*0.3||digits>4) return "";
  let m=/^[\[\-=*#_\s]{1,}\s*([A-Z][A-Z0-9 \/&().,'-]{2,40}?)\s*[\]\-=*#_\s]{1,}$/.exec(t);
  if(m&&/[\[\]\-=*#]/.test(t[0])&&letters>=3) return m[1].trim();
  const up=t.toUpperCase();
  const k=OFP_KEYS.find(k=>up.startsWith(k)&&(up.length===k.length||/[\s:\-–(\/S]/.test(up[k.length])));
  if(k&&!digits&&letters/t.replace(/\s/g,"").length>0.6&&t.split(/\s{3,}/).length<=4) return t.split(/\s{3,}/)[0].replace(/[:\-–=\s]+$/,"");
  return "";
}
function ofpSections(text){
  const lines=text.split("\n"), secs=[]; let cur={title:"",lines:[]};
  const push=()=>{ if(cur.lines.some(l=>l.trim())) secs.push(cur); };
  lines.forEach(l=>{
    if(l.includes("\u000c")){ push(); cur={title:"",lines:[]}; return; }
    const h=ofpHeading(l);
    if(h&&cur.lines.filter(x=>x.trim()).length>=2){ push(); cur={title:h,lines:[l]}; return; }
    if(h&&!cur.title) cur.title=h;
    cur.lines.push(l);
  });
  push();
  // merge tiny untitled fragments into previous
  const out=[];
  secs.forEach(s=>{ const n=s.lines.filter(x=>x.trim()).length; if(out.length&&!s.title&&n<3) out[out.length-1].lines.push(...s.lines); else out.push(s); });
  out.forEach((s,i)=>{ if(!s.title){ const f=s.lines.find(x=>x.trim())||""; s.title=f.trim().replace(/\s{2,}.*/,"").slice(0,26)||("Part "+(i+1)); } s.title=s.title.replace(/\s+/g," "); if(s.title.length>26) s.title=s.title.slice(0,26).replace(/\s+\S*$/,"")+"…"; });
  return out;
}
const OFP_PARTS=[
  {label:"Fuel",      re:[/^\W*FUEL\b/i,/\bFUEL (PLAN|SUMMARY|CALCULATION)\b/i,/^\s*TRIP\s+\S/i]},
  {label:"Navlog",    re:[/NAV ?LOG|FLIGHT LOG/i,/^\s*(FIX|WPT|WAYPOINT)\s+(AWY|VIA|FREQ|MT|TRK)/i]},
  {label:"Winds",     re:[/WIND (INFORMATION|DATA|SUMMARY)|WINDS? ALOFT/i,/^\W*WINDS?\b/i]},
  {label:"Weather",   re:[/WEATHER/i,/^\W*(METARS?|TAFS?)\b/i]},
  {label:"NOTAMs",    re:[/NOTAM/i]},
  {label:"Performance",re:[/TAKEOFF PERF|TAKE-OFF PERF|LANDING PERF|\bTLR\b|RUNWAY ANALYSIS/i]},
  {label:"ATC flight plan",re:[/ATC FLIGHT PLAN/i,/\(FPL-/i]}
];
function ofpViewer(text){
  const lines=text.replace(/\u000c/g,"").split("\n");
  const found=[{label:"Summary",line:0}];
  OFP_PARTS.forEach(p=>{
    for(const r of p.re){ const i=lines.findIndex((l,idx)=>idx>0&&l.trim().length<70&&r.test(l)); if(i>0){ found.push({label:p.label,line:i}); break; } }
  });
  const uniq=[]; found.sort((x,y)=>x.line-y.line).forEach(f=>{ if(!uniq.some(u=>u.line===f.line)) uniq.push(f); });
  uniq.forEach((f,i)=>f.id="ofpm"+i);
  const at={}; uniq.forEach(f=>at[f.line]=f.id);
  const html=lines.map((l,i)=>(at[i]!==undefined?`<span class="ofp-mk" id="${at[i]}"></span>`:"")+esc(l)).join("\n");
  return {marks:uniq,html};
}
function applyOfpToBriefing(s){
  const b=S.briefing, h=b.hdr, f=b.f;
  if(s.cs) h.cs=s.cs; if(s.from) h.from=s.from; if(s.to) h.to=s.to; if(s.t.date) h.date=s.t.date;
  const vi=variantInfo(s.variant);
  if(vi&&WIZZ_TYPES.includes(s.variant)){ h.w.type=s.variant; h.w.eng=s.eng||enginesFor(s.variant)[0]||""; if(s.reg) h.w.reg=s.reg; delete h.w.legacy; }
  if(vi){ h.g.fam=vi.fam.id; h.g.variant=s.variant; h.g.eng=s.eng||enginesFor(s.variant)[0]||""; if(s.reg) h.g.reg=s.reg; S.checklist.sel=vi.fam.cl; }
  const u=s.units==="lbs"?"lb":"kg";
  const set=(k,v)=>{ if(v) f[k]=v; };
  set("dep_pm.departure_runway",s.depRwy); set("dep_pm.sid",s.sid);
  set("dep_pm.extra_fuel_time",s.fuel.extra?`${num(s.fuel.extra)} ${u}`:"");
  set("arr_pm.star_transition",s.star); set("arr_pm.expected_runway",s.arrRwy);
  set("arr_pm.landing_fuel",s.fuel.ldg?`${num(s.fuel.ldg)} ${u}`:"");
  set("arr_pm.extra_fuel_time",s.fuel.extra?`${num(s.fuel.extra)} ${u}`:"");
  set("dep_pf.return_diversion",s.altn?`ALTN ${s.altn}${s.altnRwy?" RWY "+s.altnRwy:""}`:"");
  save("briefing"); save("checklist");
}
function sbLink(){
  const id=(S.settings.sb||"").trim(); if(!id) return "";
  return `https://www.simbrief.com/api/xml.fetcher.php?${/^\d+$/.test(id)?"userid":"username"}=${encodeURIComponent(id)}&json=1`;
}
function importOfp(txt){
  try{
    const o=parseOfpInput(txt), s=summarizeOfp(o);
    S.ofp={sum:s,text:ofpText(o),at:new Date().toISOString()}; save("ofp");
    S.perf={to:{},ldg:{}}; perfDefaults(); save("perf");
    applyOfpToBriefing(s);
    const wizzOk=WIZZ_TYPES.includes(s.variant);
    if(s.variant&&!wizzOk&&isWizz()) { S.settings.mode="global"; save("settings"); applyMode(); }
    render(); toast(`OFP ${s.cs} ${s.from}→${s.to} imported · briefing filled`);
    return true;
  }catch(e){ const el=$("#ofpErr"); if(el) el.textContent=e.message||"Import failed."; return false; }
}

/* ---- Fuel adjustments: editable EXTRA + DISCRETIONARY ----
   Extra fuel loaded must also be carried: ≈3.5 % of the added fuel is burnt per flight hour (rule of thumb). */
const CARRY_RATE=0.035;
const hmToH=s=>{const m=/^(\d+):(\d{2})$/.exec(s||"");return m?(+m[1]+(+m[2])/60):0};
function fuelAdj(){
  const s=S.ofp&&S.ofp.sum; if(!s) return null;
  const A=S.ofp.adj||{}, ofpX=+s.fuel.extra||0;
  const x=(A.extra!==undefined&&A.extra!==null&&A.extra!=="")?+A.extra:ofpX, disc=+A.disc||0;
  const d=(x-ofpX)+disc, eteH=hmToH(s.t.ete)||(+s.fuel.trip&&0), carry=Math.round(d*CARRY_RATE*eteH);
  const n=v=>v===""||v==null?null:+v;
  return {ofpX,x,disc,d,carry,eteH,changed:d!==0,
    trip:n(s.fuel.trip)!=null?+s.fuel.trip+carry:null, ramp:n(s.fuel.ramp)!=null?+s.fuel.ramp+d:null,
    tof:n(s.fuel.tof)!=null?+s.fuel.tof+d:null, ldg:n(s.fuel.ldg)!=null?+s.fuel.ldg+d-carry:null,
    mintof:n(s.fuel.mintof),
    tow:n(s.wt.tow)!=null?+s.wt.tow+d:null, ldw:n(s.wt.ldw)!=null?+s.wt.ldw+d-carry:null};
}
function setFuelAdj(k,v){
  const before=fuelAdj(); S.ofp.adj=S.ofp.adj||{}; S.ofp.adj[k]=v; const after=fuelAdj(); save("ofp");
  // propagate to Perf weights that were auto-filled
  const s=S.ofp.sum, kk=s.units==="lbs"?0.4536:1, P=S.perf;
  if(P.to._a&&after.tow!=null) P.to.w=String(Math.round(after.tow*kk));
  if(P.ldg._a&&after.ldw!=null) P.ldg.w=String(Math.round(after.ldw*kk));
  save("perf");
  // propagate to briefing
  const u=s.units==="lbs"?"lb":"kg", f=S.briefing.f;
  const xs=`${num(after.x)} ${u}${after.disc?` + DISC ${num(after.disc)} ${u}`:""}`;
  f["dep_pm.extra_fuel_time"]=xs; f["arr_pm.extra_fuel_time"]=xs;
  if(after.ldg!=null) f["arr_pm.landing_fuel"]=`${num(after.ldg)} ${u}`;
  save("briefing");
}
