/* ===================== Briefing → Navlog sheet (write / highlight / type, Apple Pencil friendly) ===================== */
// Page units: width 1000, height 1414 (A4). Ink is drawn on a canvas over the sheet image; nothing changes the template.
const NL_W=1000, NL_H=1414;
const NL_COLS=["#111111","#1f5fd6","#d0212a","#138a45","#ffd400","#ff5fa2"];
const NL_SIZES={pen:[1.6,2.6,4],hl:[16,24,34],txt:[18,24,32]};
const NL={tool:"pen",color:"#111111",size:1,cv:null,ctx:null,hist:[],fut:[],cur:null,penSeen:false,ptrs:new Map(),zoom:1,edit:null};
function nlState(){ S.navlog=S.navlog||{sheets:[],cur:""}; const N=S.navlog; if(!N.sheets.length){ N.sheets.push(nlNewSheet()); N.cur=N.sheets[0].id; } if(!N.sheets.find(s=>s.id===N.cur)) N.cur=N.sheets[0].id; if(N.pencil===undefined) N.pencil=false; return N; }
function nlNewSheet(){ const h=S.briefing.hdr||{}; return {id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),title:[h.cs,h.from&&h.to?h.from+"–"+h.to:""].filter(Boolean).join(" ")||"Navlog",at:Date.now(),items:[]}; }
const nlSheet=()=>{ const N=nlState(); return N.sheets.find(s=>s.id===N.cur); };
let _nlSaveT; function nlSave(){ clearTimeout(_nlSaveT); _nlSaveT=setTimeout(()=>save("navlog"),400); }

function renderNavlog(el,vseg,vbind){
  const N=nlState(), sh=nlSheet(), ic=d=>`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
  const T=[["pen","Pen","M4 20l4-1 11-11-3-3L5 16z"],["hl","Highlight","M4 20h16M6 15l8-8 3 3-8 8H6z"],["txt","Text","M5 6V4h14v2M12 4v16M9 20h6"],["era","Eraser","M8 20h12M5 14l8-8 6 6-6 6H9z"]];
  el.innerHTML=`${vseg}
  <div class="page-head"><span class="title-chip">Navlog</span>
    <select id="nlSheet" class="nl-sel">${N.sheets.map(s=>`<option value="${s.id}" ${s.id===N.cur?"selected":""}>${esc(s.title)} · ${new Date(s.at).toLocaleDateString(undefined,{day:"numeric",month:"short"})}</option>`).join("")}</select>
    <span class="sp"></span>
    <button class="btn ghost" id="nlFill" title="Write callsign, aircraft and airports in the header boxes">Fill header</button>
    <button class="btn ghost" id="nlNew">+ New sheet</button>
    <button class="btn ghost" id="nlMore">⋯</button>
  </div>
  <div class="nl-tools">
    <span class="dv-grp">${T.map(([k,l,d])=>`<button class="dv-t ${NL.tool===k?"on":""}" data-nt="${k}">${ic(d)}<span>${l}</span></button>`).join("")}</span>
    <span class="dv-grp dv-cols">${NL_COLS.map(c=>`<button class="dv-c ${NL.color===c?"on":""}" data-nc="${c}" style="--c:${c}" aria-label="colour"></button>`).join("")}</span>
    <span class="dv-grp nl-sz">${[0,1,2].map(i=>`<button class="${NL.size===i?"on":""}" data-ns="${i}" aria-label="size"><i style="width:${4+i*4}px;height:${4+i*4}px"></i></button>`).join("")}</span>
    <span class="dv-grp"><button class="dv-t" id="nlUndo">${ic("M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3")}<span>Undo</span></button><button class="dv-t" id="nlRedo">${ic("M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3")}<span>Redo</span></button></span>
    <label class="nl-pen ${N.pencil?"on":""}" title="Only the Apple Pencil writes; fingers scroll"><input type="checkbox" id="nlPencil" ${N.pencil?"checked":""}> ✎ Pencil only</label>
  </div>
  <div class="nl-wrap"><div class="nl-page" id="nlPage"><img src="${NAVLOG_IMG}" alt="Navlog template" draggable="false"><canvas id="nlCv"></canvas><div class="nl-txt" id="nlTxt"></div></div></div>`;
  vbind();
  NL.cv=$("#nlCv"); NL.ctx=NL.cv.getContext("2d"); NL.hist=[]; NL.fut=[];
  nlResize(); nlRedraw(); nlBind();
  $("#nlSheet").onchange=e=>{ N.cur=e.target.value; save("navlog"); render(); };
  $("#nlNew").onclick=()=>{ const s=nlNewSheet(); N.sheets.unshift(s); N.cur=s.id; if(N.sheets.length>30) N.sheets.length=30; save("navlog"); render(); toast("New navlog sheet"); };
  $("#nlFill").onclick=nlFillHeader;
  $("#nlMore").onclick=nlMenu;
  el.querySelectorAll("[data-nt]").forEach(b=>b.onclick=()=>{ NL.tool=b.dataset.nt; el.querySelectorAll("[data-nt]").forEach(x=>x.classList.toggle("on",x===b)); if(NL.tool==="hl"&&NL.color==="#111111") nlColor("#ffd400"); if(NL.tool==="pen"&&NL.color==="#ffd400") nlColor("#111111"); });
  el.querySelectorAll("[data-nc]").forEach(b=>b.onclick=()=>nlColor(b.dataset.nc));
  el.querySelectorAll("[data-ns]").forEach(b=>b.onclick=()=>{ NL.size=+b.dataset.ns; el.querySelectorAll("[data-ns]").forEach(x=>x.classList.toggle("on",x===b)); });
  $("#nlUndo").onclick=nlUndo; $("#nlRedo").onclick=nlRedo;
  $("#nlPencil").onchange=e=>{ N.pencil=e.target.checked; save("navlog"); e.target.parentElement.classList.toggle("on",N.pencil); nlTouchMode(); };
  nlTouchMode();
}
function nlColor(c){ NL.color=c; document.querySelectorAll("[data-nc]").forEach(x=>x.classList.toggle("on",x.dataset.nc===c)); }
function nlTouchMode(){ const p=$("#nlPage"); if(p) p.style.touchAction=nlState().pencil?"pan-x pan-y pinch-zoom":"none"; }
function nlResize(){ const p=$("#nlPage"); if(!p||!NL.cv) return; const w=p.clientWidth, h=w*NL_H/NL_W, dpr=Math.min(window.devicePixelRatio||1,3);
  p.style.height=h+"px"; NL.cv.width=Math.round(w*dpr); NL.cv.height=Math.round(h*dpr); NL.cv.style.width=w+"px"; NL.cv.style.height=h+"px"; NL.k=w/NL_W; NL.dpr=dpr; }
window.addEventListener("resize",()=>{ if(NL.cv&&NL.cv.isConnected){ nlResize(); nlRedraw(); } });

/* ---- drawing ---- */
function nlStroke(ctx,it){
  const P=it.d; if(!P||!P.length) return;
  ctx.save(); ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle=it.c;
  if(it.t==="h"){ ctx.globalAlpha=0.35; ctx.globalCompositeOperation="multiply"; ctx.lineWidth=it.w; ctx.lineCap="butt"; ctx.beginPath(); P.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.stroke(); ctx.restore(); return; }
  if(P.length===1){ ctx.fillStyle=it.c; ctx.beginPath(); ctx.arc(P[0][0],P[0][1],it.w*0.6,0,7); ctx.fill(); ctx.restore(); return; }
  for(let i=1;i<P.length;i++){ const a=P[i-1], b=P[i], pr=((a[2]||0.5)+(b[2]||0.5))/2;
    ctx.lineWidth=it.w*(0.45+pr*1.1); ctx.beginPath();
    if(i>1){ const z=P[i-2]; ctx.moveTo((z[0]+a[0])/2,(z[1]+a[1])/2); ctx.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2); } else { ctx.moveTo(a[0],a[1]); ctx.lineTo((a[0]+b[0])/2,(a[1]+b[1])/2); }
    ctx.stroke(); }
  const l=P[P.length-1], m=P[P.length-2]; ctx.lineWidth=it.w*(0.45+(l[2]||0.5)*1.1); ctx.beginPath(); ctx.moveTo((m[0]+l[0])/2,(m[1]+l[1])/2); ctx.lineTo(l[0],l[1]); ctx.stroke();
  ctx.restore();
}
function nlRedraw(){
  const c=NL.ctx; if(!c) return; c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,NL.cv.width,NL.cv.height);
  const s=NL.k*NL.dpr; c.setTransform(s,0,0,s,0,0);
  const sh=nlSheet(); sh.items.filter(i=>i.t==="h").forEach(i=>nlStroke(c,i)); sh.items.filter(i=>i.t==="p").forEach(i=>nlStroke(c,i));
  if(NL.cur&&NL.cur.it) nlStroke(c,NL.cur.it);
  const box=$("#nlTxt"); if(box){ box.innerHTML=sh.items.map((i,ix)=>i.t==="x"?`<div class="nl-t" data-ix="${ix}" style="left:${i.x/NL_W*100}%;top:${i.y/NL_H*100}%;color:${i.c};font-size:${i.fs*NL.k}px">${esc(i.s).replace(/\n/g,"<br>")}</div>`:"").join(""); }
}
function nlPt(e){ const r=NL.cv.getBoundingClientRect(); return [Math.round((e.clientX-r.left)/r.width*NL_W*10)/10,Math.round((e.clientY-r.top)/r.height*NL_H*10)/10,e.pointerType==="pen"&&e.pressure>0?Math.round(e.pressure*100)/100:0.5]; }
function nlCommit(next){ const sh=nlSheet(); NL.hist.push(sh.items.slice()); if(NL.hist.length>150) NL.hist.shift(); NL.fut=[]; sh.items=next; nlSave(); nlRedraw(); }
function nlUndo(){ const sh=nlSheet(), h=NL.hist.pop(); if(!h){ toast("Nothing to undo"); return; } NL.fut.push(sh.items.slice()); sh.items=h; nlSave(); nlRedraw(); }
function nlRedo(){ const sh=nlSheet(), h=NL.fut.pop(); if(!h){ toast("Nothing to redo"); return; } NL.hist.push(sh.items.slice()); sh.items=h; nlSave(); nlRedraw(); }
function nlHit(it,p,tol){
  if(it.t==="x"){ const L=String(it.s).split("\n"), w=Math.max(...L.map(l=>l.length))*it.fs*0.56; return p[0]>=it.x-tol&&p[0]<=it.x+w+tol&&p[1]>=it.y-tol&&p[1]<=it.y+L.length*it.fs*1.25+tol; }
  const d=it.d; for(let i=0;i<d.length;i++){ const a=d[i], b=d[i+1]||a; if(segDist([p[0],p[1]],[a[0],a[1]],[b[0],b[1]])<=tol+it.w/2) return true; } return false;
}
function nlBind(){
  const page=$("#nlPage"), P=NL.ptrs; let scrollMid=null;
  const canDraw=e=>{ if(e.pointerType==="pen"){ if(!NL.penSeen){ NL.penSeen=true; const N=nlState(); if(!N.pencil){ N.pencil=true; save("navlog"); const c=$("#nlPencil"); if(c){ c.checked=true; c.parentElement.classList.add("on"); } nlTouchMode(); toast("Apple Pencil detected — fingers now scroll"); } } return true; }
    if(e.pointerType==="mouse") return e.button===0; return !nlState().pencil; };
  page.addEventListener("touchstart",e=>{ if([...e.touches].some(t=>t.touchType==="stylus")) e.preventDefault(); },{passive:false});
  page.addEventListener("touchmove",e=>{ if([...e.touches].some(t=>t.touchType==="stylus")) e.preventDefault(); },{passive:false});
  page.addEventListener("pointerdown",e=>{
    if(e.target.closest(".nl-edit")) return;
    const open=document.querySelector(".nl-edit"); if(open){ e.preventDefault(); open.blur(); return; }
    if(!canDraw(e)) return;
    if(e.pointerType==="touch"){ P.set(e.pointerId,[e.clientX,e.clientY]); if(P.size>=2){ if(NL.cur){ NL.cur=null; nlRedraw(); } const a=[...P.values()]; scrollMid=[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2]; return; } }
    e.preventDefault(); try{ page.setPointerCapture(e.pointerId); }catch(_){}
    const p=nlPt(e);
    if(NL.tool==="txt"){ const ti=e.target.closest(".nl-t"); NL.cur={id:e.pointerId,txt:1,p,ix:ti?+ti.dataset.ix:null}; return; }
    if(NL.tool==="era"){ NL.cur={id:e.pointerId,era:1,before:nlSheet().items.slice(),hit:false}; nlErase(p); return; }
    const hl=NL.tool==="hl"; NL.cur={id:e.pointerId,it:{t:hl?"h":"p",c:NL.color,w:NL_SIZES[hl?"hl":"pen"][NL.size],d:[p]}};
    nlRedraw();
  });
  page.addEventListener("pointermove",e=>{
    if(e.pointerType==="touch"&&P.has(e.pointerId)){ P.set(e.pointerId,[e.clientX,e.clientY]); if(P.size>=2&&scrollMid){ const a=[...P.values()], m=[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2]; window.scrollBy(0,scrollMid[1]-m[1]); const w=$(".nl-wrap"); if(w) w.scrollLeft+=scrollMid[0]-m[0]; scrollMid=m; return; } }
    const c=NL.cur; if(!c||c.id!==e.pointerId) return; e.preventDefault();
    let evs=e.getCoalescedEvents?e.getCoalescedEvents():[]; if(!evs||!evs.length) evs=[e];
    if(c.era){ evs.forEach(x=>nlErase(nlPt(x))); return; }
    if(c.txt) return;
    evs.forEach(x=>{ const p=nlPt(x), l=c.it.d[c.it.d.length-1]; if(Math.hypot(p[0]-l[0],p[1]-l[1])>=0.8) c.it.d.push(p); });
    if(c.it.t==="h"){ const d=c.it.d, xs=d.map(q=>q[0]), ys=d.map(q=>q[1]), dx=Math.max(...xs)-Math.min(...xs), dy=Math.max(...ys)-Math.min(...ys); c.straight=dx>8&&dy<Math.max(12,dx*0.22)?[[d[0][0],ys.reduce((a,b)=>a+b,0)/ys.length],[d[d.length-1][0],ys.reduce((a,b)=>a+b,0)/ys.length]]:null; }
    nlRedraw();
  });
  const end=e=>{
    if(e.pointerType==="touch"){ P.delete(e.pointerId); if(P.size<2) scrollMid=null; }
    const c=NL.cur; if(!c||c.id!==e.pointerId) return; NL.cur=null;
    if(e.type==="pointercancel"){ if(c.era&&c.hit){ nlSheet().items=c.before; } nlRedraw(); return; }
    if(c.txt){ nlTextEdit(c.ix!=null?c.ix:null,c.p); return; }
    if(c.era){ if(c.hit){ const now=nlSheet().items.slice(); nlSheet().items=c.before; nlCommit(now); } return; }
    const it=c.it; if(it.t==="h"&&c.straight) it.d=c.straight.map(q=>[Math.round(q[0]*10)/10,Math.round(q[1]*10)/10]);
    if(it.t==="h"&&it.d.length<2){ nlRedraw(); return; }
    if(it.d.length>3){ const o=[it.d[0]]; for(let i=1;i<it.d.length-1;i++){ const l=o[o.length-1]; if(Math.hypot(it.d[i][0]-l[0],it.d[i][1]-l[1])>=1.2) o.push(it.d[i]); } o.push(it.d[it.d.length-1]); it.d=o; }
    nlCommit([...nlSheet().items,it]);
  };
  page.addEventListener("pointerup",end); page.addEventListener("pointercancel",end);
}
function nlErase(p){ const sh=nlSheet(), keep=sh.items.filter(it=>!nlHit(it,p,7)); if(keep.length!==sh.items.length){ sh.items=keep; NL.cur.hit=true; nlRedraw(); } }
function nlTextEdit(ix,p){
  const sh=nlSheet(), old=ix!=null?sh.items[ix]:null, page=$("#nlPage"); if(!page) return;
  const fs=old?old.fs:NL_SIZES.txt[NL.size], col=old?old.c:(NL.color==="#ffd400"?"#111111":NL.color), x=old?old.x:p[0], y=old?old.y:p[1]-fs*0.6;

}

/* =====================================================================
   EFB — modular single-page app (Wizz mode + Global mode)

   render(el), badge()) and, if it needs saved data, a key in DEFAULTS.

const IS_SA=(typeof STANDALONE!=="undefined"&&STANDALONE);
/* ---------------- state & storage ---------------- */
const DEFAULTS = {
  flights:  {list:SEED_FLIGHTS},
  briefing: {hdr:{w:{},g:{}}, f:{}, closed:{}},
  checklist:{c:{}, sec:{}, sel:""},
  settings: {pilot:"Pilot", mode:"wizz", sb:""},

};
const S = JSON.parse(JSON.stringify(DEFAULTS));
const LS = "efb_a320_v1_";
let db=null, uid=null;
function lsGet(k){try{const v=localStorage.getItem(LS+k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}}
const TYPE_FIX={"A321-200":"A321ceo","A320-200":"A320ceo","A319-100":"A319ceo"};
function normalizeTypes(){ let ch=false; (S.flights.list||[]).forEach(f=>{ if(TYPE_FIX[f.type]){ f.type=TYPE_FIX[f.type]; ch=true; } }); if(ch) save("flights"); }
function applyLogImports(){
  const fl=S.flights; fl.applied=fl.applied||[]; let changed=false;
  (typeof LOG_IMPORTS!=="undefined"?LOG_IMPORTS:[]).forEach(b=>{
    if(fl.applied.includes(b.id)) return;
    (b.fixes||[]).forEach(([d,oldCs,newCs])=>{const x=fl.list.find(f=>f.date===d&&f.cs===oldCs); if(x){x.cs=newCs;}});
    const key=f=>f.date+"|"+(f.cs||"").toUpperCase();
    const have=new Set(fl.list.map(key));
    b.flights.forEach(([d,cs,sec],i)=>{ if(!have.has(d+"|"+cs)){ fl.list.push({id:b.id+"-"+i,date:d,cs,type:"",eng:"",reg:"",from:"",to:"",dep:"",arr:"",dur:sec,rmk:""}); have.add(d+"|"+cs);} });
    fl.applied.push(b.id); changed=true;
  });
  if(changed) save("flights");
}
function migrate(){
  // v1 -> v2 data shapes
  const b=S.briefing; b.hdr=b.hdr||{}; b.hdr.w=b.hdr.w||{}; b.hdr.g=b.hdr.g||{};
  if(b.hdr.type&&!b.hdr.w.type){b.hdr.w.legacy=b.hdr.type; delete b.hdr.type}
  if(b.hdr.reg&&!b.hdr.w.reg){b.hdr.w.reg=b.hdr.reg; delete b.hdr.reg}
  const c=S.checklist;
  if(typeof c.sec!=="object"||c.sec===null) c.sec={a320:+c.sec||0};
  Object.keys(c.c||{}).forEach(k=>{ if(!k.includes(":")){ c.c["a320:"+k]=c.c[k]; delete c.c[k]; } });
  if(!S.settings.mode) S.settings.mode="wizz";
  if(String(S.settings.mode).startsWith("p:")) S.settings.mode="global";
  delete S.settings.profiles;
  Object.keys(CHECKLISTS).forEach(id=>{ const v=CHECKLISTS[id].v||1; c.ver=c.ver||{};
    if((c.ver[id]||1)!==v){ Object.keys(c.c).forEach(k=>{if(k.startsWith(id+":"))delete c.c[k]}); c.sec[id]=0; c.ver[id]=v; } });
}
for(const k in DEFAULTS){const v=lsGet(k); if(v) S[k]=Object.assign({},DEFAULTS[k],v);}
migrate();

const timers={}, writing={}, dirty={};
function save(k){ lsSet(k,S[k]); clearTimeout(timers[k]); timers[k]=setTimeout(()=>flush(k),700); }
async function flush(k){
  if(!db||!uid) return;
  if(writing[k]){dirty[k]=true;return;}
  writing[k]=true;
  try{ await db.doc(`data/users/${uid}/${k}`).set(JSON.parse(JSON.stringify(S[k]))); setSync(true); }
  catch(e){ setSync(false); }
  writing[k]=false;
  if(dirty[k]){dirty[k]=false;flush(k);}
}
function setSync(ok){
  const el=document.getElementById("stSync");
  el.textContent= ok ? "☁ Sync OK" : "☁ Local";
  el.className = "sync"+(ok?"":" local");
}
applyLogImports(); normalizeTypes();
async function connect(){
  try{
    if(IS_SA){ setSync(false); const e=document.getElementById("stSync"); if(e) e.textContent="⛁ On device"; return; }
    if(!window.claude||!claude.use) return;
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!d||!u) return;
    const id=await u.id(); if(!id) return;
    db=d; uid=id;
    const keys=Object.keys(DEFAULTS);
    const timeout=new Promise(r=>setTimeout(()=>r("timeout"),10000));
    const res=await Promise.race([Promise.all(keys.map(k=>db.doc(`data/users/${uid}/${k}`).get())),timeout]);
    if(res==="timeout"){setSync(false);return;}
    res.forEach((snap,i)=>{
      const k=keys[i];
      if(snap.exists){ S[k]=Object.assign({},DEFAULTS[k],JSON.parse(JSON.stringify(snap.data()))); lsSet(k,S[k]); }
      else if(lsGet(k)){ flush(k); }
    });
    migrate(); applyLogImports(); normalizeTypes(); applyMode(); setSync(true); render();
  }catch(e){ setSync(false); }
}

      }
      else if(k==="reg"){ inp.value=inp.value.toUpperCase(); w.reg=inp.value; save("briefing"); updateStatus(); clearTimeout(S._rt); S._rt=setTimeout(()=>{const y=window.scrollY;render();window.scrollTo(0,y);const n=document.querySelector('[data-w=reg]');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}},900); return; }

      const g=S.briefing.hdr.g, k=inp.dataset.g;

    e.preventDefault(); const list=fields(), i=list.indexOf(t);
    if(i>=0&&i<list.length-1){ const nx=list[i+1]; nx.focus(); if(nx.select&&nx.tagName==="INPUT"&&nx.type!=="date") nx.select(); nx.scrollIntoView({block:"center",behavior:"smooth"}); }

  };

}
function briefingText(){
  const h=S.briefing.hdr, f=S.briefing.f, ac=currentAc();
  let t=`${h.cs||"----"}  ${h.from||"----"} → ${h.to||"----"}  ${h.date?fdate(h.date):""}\n${ac.type} ${ac.eng?"("+ac.eng+")":""} ${ac.reg}\n`;
  BRIEFING.forEach(sec=>{
    t+=`\n${sec.title.toUpperCase()} — ${sec.role}\n`;

      else t+=`  ${fd.k}: ${fd.tri.map(x=>f[sec.id+"."+slug(x)]||"—").join(" / ")}\n`;
    });
  });

}

/* ================= MODULE: CHECKLIST ================= */
function activeCl(){
  if(isWizz()) return "a320";
  if(S.checklist.sel&&CHECKLISTS[S.checklist.sel]&&clAllowed(S.checklist.sel)) return S.checklist.sel;
  const fam=FAMILIES.find(f=>f.id===currentAc().fam); if(fam&&clAllowed(fam.cl)) return fam.cl;
  return Object.keys(CHECKLISTS).find(clAllowed)||"a320";
}
function clItems(cl,si){return CHECKLISTS[cl].sections[si].i.map((raw,ii)=>{
  const id=`${cl}:${si}_${ii}`;
  if(raw[0]===">") return {id,kind:"banner",text:raw.slice(1)};
  if(raw[0]==="#") return {id,kind:"sub",text:raw.slice(1)};
  if(raw[0]==="!") return {id,kind:"info",text:raw.slice(1)};
  if(raw[0]==="~") return {id,kind:"action",lbl:raw.slice(1)};
  const [l,v]=raw.split("|"); return {id,kind:"item",lbl:l,val:v};
})}
const checkable=x=>x.kind==="item"||x.kind==="action";
function clProgress(cl,si){const it=clItems(cl,si).filter(checkable);return [it.filter(x=>S.checklist.c[x.id]).length,it.length]}
function clTotals(cl){let a=0,b=0;CHECKLISTS[cl].sections.forEach((_,i)=>{const [x,y]=clProgress(cl,i);a+=x;b+=y});return [a,b]}
function tagLabel(l){
  return esc(l).replace(/^\[AT\]\s*/,'<span class="tag at">AT</span>').replace(/^\[NO AT\]\s*/,'<span class="tag noat">NO AT</span>').replace(/^\[GPU\]\s*/,'<span class="tag gpu">GPU</span>');
}

function clViewSeg(el){
  const v=S.checklist.view==="docs"?"docs":"cl";
  const h=`<div class="vseg"><button data-v="cl" class="${v==="cl"?"on":""}">${ICON.check}Checklists</button><button data-v="docs" class="${v==="docs"?"on":""}">${docSvg("M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9zM14 3v6h6M8 13h8M8 17h5",16)}Documents</button></div>`;
  return [h,()=>el.querySelectorAll(".vseg button").forEach(b=>b.onclick=()=>{ if(S.checklist.view===b.dataset.v) return; S.checklist.view=b.dataset.v; save("checklist"); render(); window.scrollTo({top:0}); })];
}
function renderChecklist(el){
  const [vseg,vbind]=clViewSeg(el);
  if(S.checklist.view==="docs"){ const sc=DOCS.scroller, keep=sc&&sc.isConnected?[sc.scrollTop,sc.scrollLeft]:null; el.innerHTML=vseg; vbind(); docsMount(el,keep); return; }
  const cl=activeCl(), C=CHECKLISTS[cl];
  const si=Math.min(S.checklist.sec[cl]||0,C.sections.length-1);
  const sec=C.sections[si], items=clItems(cl,si), [a,b]=clProgress(cl,si), [ta,tb]=clTotals(cl);
  const nextId=(items.find(x=>checkable(x)&&!S.checklist.c[x.id])||{}).id;
  el.innerHTML=`${vseg}
  <div class="page-head"><span class="title-chip">${esc(C.title)}</span><span class="sp"></span>
    <button class="btn ghost" id="cResetAll">Reset all</button></div>
  ${isWizz()?"":`<div class="cl-pick">${Object.entries(CHECKLISTS).filter(([id])=>clAllowed(id)).sort((x,y)=>["a220","a320","b737","b757","b777"].indexOf(x[0])-["a220","a320","b737","b757","b777"].indexOf(y[0])).map(([id,c])=>`<button data-cl="${id}" class="${id===cl?"on":""}">${esc(c.name)}</button>`).join("")}</div>`}
  <div class="cl-src ${C.generic?"warn":""}">Source: ${esc(C.src)}${C.generic?" — send me your A220 checklist to replace it":""}</div>
  <div class="overall"><span class="mono">${ta}/${tb}</span><div class="bar ${ta===tb?"done":""}"><i style="width:${tb?ta/tb*100:0}%"></i></div><span>${tb?Math.round(ta/tb*100):0}%</span></div>
  <div class="cl-wrap">
    <div class="cl-nav">${C.sections.map((s,i)=>{const [x,y]=clProgress(cl,i);
      return `<button data-sec="${i}" class="${i===si?"on":""} ${y&&x===y?"done":x?"part":""}"><span class="dot"></span>${esc(s.t)}<span class="n">${y?x+"/"+y:"info"}</span></button>`}).join("")}</div>
    <div>
      <div class="cl-title"><h3>${esc(sec.t)}</h3><span class="mono muted" style="font-size:12px">${b?a+"/"+b:""}</span></div>
      ${items.map(x=>{
        if(x.kind==="banner") return `<div class="banner">${esc(x.text)}</div>`;
        if(x.kind==="sub") return `<div class="subhead">${esc(x.text)}</div>`;
        if(x.kind==="info") return `<div class="info">${esc(x.text)}</div>`;
        const on=!!S.checklist.c[x.id];
        return `<button class="item ${x.kind==="action"?"action":""} ${on?"on":""} ${x.id===nextId?"next":""}" data-id="${x.id}">
          <span class="chk">${on?'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0f1013" stroke-width="4"><path d="M4 12l5 5L20 6"/></svg>':""}</span>
          <span class="lbl">${tagLabel(x.lbl)}</span>${x.kind==="item"?`<span class="lead"></span><span class="val">${esc(x.val)}</span>`:""}</button>`}).join("")}
      ${b&&a===b?`<div class="complete">${esc(sec.t)} — COMPLETE</div>`:""}
      <div class="cl-foot">
        <button class="btn ghost" id="cPrev" ${si===0?"disabled":""}>‹ Prev</button>
        <button class="btn ghost" id="cResetSec">Reset section</button>
        <button class="btn ghost" id="cAll">Check all</button>
        <span style="flex:1"></span>
        <button class="btn ${b&&a===b?"mag":"ghost"}" id="cNext" ${si===C.sections.length-1?"disabled":""}>Next ›</button>
      </div>
    </div>
  </div>`;
  vbind();
  const go=i=>{S.checklist.sec[cl]=i;save("checklist");render();window.scrollTo({top:0})};
  const onBtn=el.querySelector(".cl-nav button.on"); if(onBtn&&onBtn.parentElement.scrollWidth>onBtn.parentElement.clientWidth){onBtn.parentElement.scrollLeft=onBtn.offsetLeft-12}
  el.querySelectorAll(".cl-pick button").forEach(bt=>bt.onclick=()=>{S.checklist.sel=bt.dataset.cl;save("checklist");render()});
  el.querySelectorAll(".cl-nav button").forEach(bt=>bt.onclick=()=>go(+bt.dataset.sec));
  el.querySelectorAll(".item").forEach(bt=>bt.onclick=()=>{
    const id=bt.dataset.id; if(S.checklist.c[id]) delete S.checklist.c[id]; else S.checklist.c[id]=true;
    save("checklist"); const y=window.scrollY; render(); window.scrollTo(0,y);
  });
  $("#cPrev").onclick=()=>go(si-1);
  $("#cNext").onclick=()=>go(si+1);
  $("#cResetSec").onclick=()=>{items.forEach(x=>delete S.checklist.c[x.id]);save("checklist");render()};
  $("#cAll").onclick=()=>{items.forEach(x=>{if(checkable(x))S.checklist.c[x.id]=true});save("checklist");render()};
  $("#cResetAll").onclick=()=>confirmBox("Reset checklist",`Uncheck every item of the ${C.name} checklist?`,"Reset",()=>{
    Object.keys(S.checklist.c).forEach(k=>{if(k.startsWith(cl+":"))delete S.checklist.c[k]}); S.checklist.sec[cl]=0;
    save("checklist");render();toast("Checklist reset")});
}

const ICAO_MAP={A318:"A318",A319:"A319ceo",A19N:"A319neo",A320:"A320ceo",A20N:"A320neo",A321:"A321ceo",A21N:"A321neo",
  BCS1:"A220-100",BCS3:"A220-300",B736:"737-600",B737:"737-700",B738:"737-800",B739:"737-900",
  B752:"757-200",B753:"757-300",B772:"777-200ER",B77L:"777-200LR",B773:"777-300",B77W:"777-300ER"};

function xmlToObj(node){
  const kids=[...node.children];
  if(!kids.length) return node.textContent;
  const o={};
  kids.forEach(k=>{const v=xmlToObj(k); if(k.tagName in o){ if(!Array.isArray(o[k.tagName])) o[k.tagName]=[o[k.tagName]]; o[k.tagName].push(v);} else o[k.tagName]=v;});
  return o;
}
function parseOfpInput(txt){
  txt=(txt||"").trim().replace(/^﻿/,"");
  if(!txt) throw new Error("Nothing to import — paste the OFP first.");
  let o;
  if(txt[0]==="{"){ o=JSON.parse(txt); }
  else if(txt[0]==="<"){
    const doc=new DOMParser().parseFromString(txt,"application/xml");
    if(doc.querySelector("parsererror")) throw new Error("This doesn't look like valid SimBrief XML.");
    o=xmlToObj(doc.documentElement);
  } else throw new Error("Paste the SimBrief JSON (starts with {) or XML (starts with <).");
  if(o.OFP) o=o.OFP;
  if(o.fetch&&o.fetch.status&&String(o.fetch.status)!=="Success") throw new Error("SimBrief says: "+o.fetch.status);
  if(!o.origin||!o.destination) throw new Error("No flight found in this data — generate a flight on SimBrief first.");
  return o;
}
const gv=(o,path)=>{let x=o;for(const p of path.split(".")){if(x==null)return "";x=x[p]}return (x==null||typeof x==="object")?"":String(x)};
const secHM=s=>{s=+s;if(!s)return "";const m=Math.round(s/60);return `${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`};
const unixHM=u=>{u=+u;if(!u)return "";const d=new Date(u*1000);return `${String(d.getUTCHours()).padStart(2,"0")}:${String(d.getUTCMinutes()).padStart(2,"0")}`};
const unixDate=u=>{u=+u;if(!u)return "";return new Date(u*1000).toISOString().slice(0,10)};
const num=v=>v===""?"":Number(v).toLocaleString("en-US");

function summarizeOfp(o){
  const fixes=(o.navlog&&o.navlog.fix)?[].concat(o.navlog.fix):[];
  const ss=fixes.filter(f=>String(f.is_sid_star)==="1");
  const firstEnroute=fixes.findIndex(f=>String(f.is_sid_star)!=="1");
  const sid=ss.length&&fixes.indexOf(ss[0])<firstEnroute?gv(ss[0],"via_airway"):"";
  const lastSS=ss.length?ss[ss.length-1]:null;
  const star=lastSS&&fixes.indexOf(lastSS)>firstEnroute?gv(lastSS,"via_airway"):"";
  const icao=gv(o,"aircraft.icaocode")||gv(o,"aircraft.icao_code");
  let variant=ICAO_MAP[icao]||"";
  const acname=gv(o,"aircraft.name");
  if(icao==="A21N"&&/XLR/i.test(acname)) variant="A321XLR"; else if(icao==="A21N"&&/\bLR\b/i.test(acname)) variant="A321LR";
  const engRaw=gv(o,"aircraft.engines");
  let eng="";
  if(variant&&engRaw){ const n=engRaw.toUpperCase().replace(/\s/g,""); eng=enginesFor(variant).find(e=>e.toUpperCase().replace(/\s/g,"").includes(n)||n.includes(e.split(" ")[0].toUpperCase()))||engRaw; }
  const cs=gv(o,"atc.callsign")||(gv(o,"general.icao_airline")+gv(o,"general.flight_number"));
  return {
    cs, airline:gv(o,"general.icao_airline"), fltnum:gv(o,"general.flight_number"),
    from:gv(o,"origin.icao_code"), fromName:gv(o,"origin.name"), depElev:gv(o,"origin.elevation"), arrElev:gv(o,"destination.elevation"), depRwy:gv(o,"origin.plan_rwy"),
    to:gv(o,"destination.icao_code"), toName:gv(o,"destination.name"), arrRwy:gv(o,"destination.plan_rwy"),
    altn:gv(o,"alternate.icao_code"), altnRwy:gv(o,"alternate.plan_rwy"),
    sid, star, route:gv(o,"general.route")||gv(o,"atc.route"),
    fl:gv(o,"general.initial_altitude"), ci:gv(o,"general.costindex"), dist:gv(o,"general.route_distance")||gv(o,"general.air_distance"),
    wind:gv(o,"general.avg_wind_comp"), icao, acname, reg:gv(o,"aircraft.reg"), variant, eng, engRaw,
    units:gv(o,"params.units")||"kgs",
    fuel:{taxi:gv(o,"fuel.taxi"),trip:gv(o,"fuel.enroute_burn"),cont:gv(o,"fuel.contingency"),altn:gv(o,"fuel.alternate_burn"),
          fres:gv(o,"fuel.reserve"),extra:gv(o,"fuel.extra"),mintof:gv(o,"fuel.min_takeoff"),tof:gv(o,"fuel.plan_takeoff"),
          ramp:gv(o,"fuel.plan_ramp"),ldg:gv(o,"fuel.plan_landing")},
    wt:{zfw:gv(o,"weights.est_zfw"),tow:gv(o,"weights.est_tow"),ldw:gv(o,"weights.est_ldw"),payload:gv(o,"weights.payload"),
        pax:gv(o,"weights.pax_count"),mzfw:gv(o,"weights.max_zfw"),mtow:gv(o,"weights.max_tow"),mlw:gv(o,"weights.max_ldw")},
    t:{out:unixHM(gv(o,"times.sched_out")),off:unixHM(gv(o,"times.sched_off")),on:unixHM(gv(o,"times.sched_on")),in:unixHM(gv(o,"times.sched_in")),
       ete:secHM(gv(o,"times.est_time_enroute")),block:secHM(gv(o,"times.est_block")),date:unixDate(gv(o,"times.sched_out"))},
    metar:{dep:gv(o,"origin.metar"),arr:gv(o,"destination.metar"),altn:gv(o,"alternate.metar")},
    taf:{dep:gv(o,"origin.taf"),arr:gv(o,"destination.taf")},
    geo:ofpGeo(o,fixes),
    nav:fixes.filter(f=>String(f.is_sid_star)!=="1"||/^(TOC|TOD)$/i.test(gv(f,"ident"))).slice(0,150).map(f=>({id:gv(f,"ident"),awy:gv(f,"via_airway"),alt:gv(f,"altitude_feet"),t:gv(f,"time_total"),fob:gv(f,"fuel_plan_onboard"),min:gv(f,"fuel_min_onboard")}))
  };
}
function ofpGeo(o,fixes){
  const P=x=>{ const a=parseFloat(gv(x||{},"pos_lat")), b=parseFloat(gv(x||{},"pos_long")); return isFinite(a)&&isFinite(b)&&(a||b)?[a,b]:null; };
  const pts=fixes.map(f=>{ const p=P(f); return p?{id:gv(f,"ident"),lat:p[0],lon:p[1],alt:+gv(f,"altitude_feet")||0,t:+gv(f,"time_total")||0,wd:gv(f,"wind_dir"),ws:gv(f,"wind_spd"),oat:gv(f,"oat"),gh:+gv(f,"ground_height")||0,ss:String(f.is_sid_star)==="1"?1:0,typ:gv(f,"type")}:null; }).filter(Boolean).slice(0,400);
  const ap=k=>{ const p=P(o[k]); return p?{id:gv(o,k+".icao_code"),lat:p[0],lon:p[1],elev:+gv(o,k+".elevation")||0}:null; };
  return {dep:ap("origin"),arr:ap("destination"),altn:ap("alternate"),pts,off:+gv(o,"times.sched_off")||0,on:+gv(o,"times.sched_on")||0,ete:+gv(o,"times.est_time_enroute")||0,fl:+gv(o,"general.initial_altitude")||0};
}
function ofpText(o){
  const h=gv(o,"text.plan_html"); if(!h) return "";
  const marked=h.replace(/<br\s*\/?>/gi,"\n").replace(/<(h\d|div|p)[^>]*page-break[^>]*>/gi,"\n\u000c\n");
  const d=new DOMParser().parseFromString(marked,"text/html");
  return (d.body.textContent||"").replace(/[ \t]+\n/g,"\n").replace(/\n{4,}/g,"\n\n\n").trim().slice(0,180000);
}
const OFP_KEYS=["ATC FLIGHT PLAN","FLIGHT PLAN","OPERATIONAL FLIGHT PLAN","OFP","FUEL","ROUTE","NAVLOG","NAV LOG","FLIGHT LOG","WIND","WEATHER","METAR","TAF","NOTAM","SIGMET","ALTERNATE","DEPARTURE","ARRIVAL","DESTINATION","ORIGIN","TAKEOFF","TAKE-OFF","LANDING","TLR","WEIGHT","MASS","LOADSHEET","LOAD","ETOPS","ENROUTE","EN-ROUTE","EN ROUTE","DISPATCH","REMARKS","PERFORMANCE","AIRPORT","MEL","COMPANY","CREW","SUMMARY","TIMES","IMPACT","OPTIONS"];
function ofpHeading(line){
  const t=line.trim(); if(t.length<3||t.length>52) return "";
  const letters=(t.match(/[A-Z]/g)||[]).length, lower=(t.match(/[a-z]/g)||[]).length, digits=(t.match(/\d/g)||[]).length;
  if(lower>letters*0.3||digits>4) return "";
  let m=/^[\[\-=*#_\s]{1,}\s*([A-Z][A-Z0-9 \/&().,'-]{2,40}?)\s*[\]\-=*#_\s]{1,}$/.exec(t);
  if(m&&/[\[\]\-=*#]/.test(t[0])&&letters>=3) return m[1].trim();
  const up=t.toUpperCase();
  const k=OFP_KEYS.find(k=>up.startsWith(k)&&(up.length===k.length||/[\s:\-–(\/S]/.test(up[k.length])));
  if(k&&!digits&&letters/t.replace(/\s/g,"").length>0.6&&t.split(/\s{3,}/).length<=4) return t.split(/\s{3,}/)[0].replace(/[:\-–=\s]+$/,"");
  return "";
}
function ofpSections(text){
  const lines=text.split("\n"), secs=[]; let cur={title:"",lines:[]};
  const push=()=>{ if(cur.lines.some(l=>l.trim())) secs.push(cur); };
  lines.forEach(l=>{
    if(l.includes("\u000c")){ push(); cur={title:"",lines:[]}; return; }
    const h=ofpHeading(l);
    if(h&&cur.lines.filter(x=>x.trim()).length>=2){ push(); cur={title:h,lines:[l]}; return; }
    if(h&&!cur.title) cur.title=h;
    cur.lines.push(l);
  });
  push();
  // merge tiny untitled fragments into previous
  const out=[];
  secs.forEach(s=>{ const n=s.lines.filter(x=>x.trim()).length; if(out.length&&!s.title&&n<3) out[out.length-1].lines.push(...s.lines); else out.push(s); });
  out.forEach((s,i)=>{ if(!s.title){ const f=s.lines.find(x=>x.trim())||""; s.title=f.trim().replace(/\s{2,}.*/,"").slice(0,26)||("Part "+(i+1)); } s.title=s.title.replace(/\s+/g," "); if(s.title.length>26) s.title=s.title.slice(0,26).replace(/\s+\S*$/,"")+"…"; });
  return out;
}
const OFP_PARTS=[
  {label:"Fuel",      re:[/^\W*FUEL\b/i,/\bFUEL (PLAN|SUMMARY|CALCULATION)\b/i,/^\s*TRIP\s+\S/i]},
  {label:"Navlog",    re:[/NAV ?LOG|FLIGHT LOG/i,/^\s*(FIX|WPT|WAYPOINT)\s+(AWY|VIA|FREQ|MT|TRK)/i]},
  {label:"Winds",     re:[/WIND (INFORMATION|DATA|SUMMARY)|WINDS? ALOFT/i,/^\W*WINDS?\b/i]},
  {label:"Weather",   re:[/WEATHER/i,/^\W*(METARS?|TAFS?)\b/i]},
  {label:"NOTAMs",    re:[/NOTAM/i]},
  {label:"Performance",re:[/TAKEOFF PERF|TAKE-OFF PERF|LANDING PERF|\bTLR\b|RUNWAY ANALYSIS/i]},
  {label:"ATC flight plan",re:[/ATC FLIGHT PLAN/i,/\(FPL-/i]}
];
function ofpViewer(text){
  const lines=text.replace(/\u000c/g,"").split("\n");
  const found=[{label:"Summary",line:0}];
  OFP_PARTS.forEach(p=>{
    for(const r of p.re){ const i=lines.findIndex((l,idx)=>idx>0&&l.trim().length<70&&r.test(l)); if(i>0){ found.push({label:p.label,line:i}); break; } }
  });
  const uniq=[]; found.sort((x,y)=>x.line-y.line).forEach(f=>{ if(!uniq.some(u=>u.line===f.line)) uniq.push(f); });
  uniq.forEach((f,i)=>f.id="ofpm"+i);
  const at={}; uniq.forEach(f=>at[f.line]=f.id);
  const html=lines.map((l,i)=>(at[i]!==undefined?`<span class="ofp-mk" id="${at[i]}"></span>`:"")+esc(l)).join("\n");
  return {marks:uniq,html};
}
function applyOfpToBriefing(s){
  const b=S.briefing, h=b.hdr, f=b.f;
  if(s.cs) h.cs=s.cs; if(s.from) h.from=s.from; if(s.to) h.to=s.to; if(s.t.date) h.date=s.t.date;
  const vi=variantInfo(s.variant);
  if(vi&&WIZZ_TYPES.includes(s.variant)){ h.w.type=s.variant; h.w.eng=s.eng||enginesFor(s.variant)[0]||""; if(s.reg) h.w.reg=s.reg; delete h.w.legacy; }
  if(vi){ h.g.fam=vi.fam.id; h.g.variant=s.variant; h.g.eng=s.eng||enginesFor(s.variant)[0]||""; if(s.reg) h.g.reg=s.reg; S.checklist.sel=vi.fam.cl; }
  const u=s.units==="lbs"?"lb":"kg";
  const set=(k,v)=>{ if(v) f[k]=v; };
  set("dep_pm.departure_runway",s.depRwy); set("dep_pm.sid",s.sid);
  set("dep_pm.extra_fuel_time",s.fuel.extra?`${num(s.fuel.extra)} ${u}`:"");
  set("arr_pm.star_transition",s.star); set("arr_pm.expected_runway",s.arrRwy);
  set("arr_pm.landing_fuel",s.fuel.ldg?`${num(s.fuel.ldg)} ${u}`:"");
  set("arr_pm.extra_fuel_time",s.fuel.extra?`${num(s.fuel.extra)} ${u}`:"");
  set("dep_pf.return_diversion",s.altn?`ALTN ${s.altn}${s.altnRwy?" RWY "+s.altnRwy:""}`:"");
  save("briefing"); save("checklist");
}
function sbLink(){
  const id=(S.settings.sb||"").trim(); if(!id) return "";
  return `https://www.simbrief.com/api/xml.fetcher.php?${/^\d+$/.test(id)?"userid":"username"}=${encodeURIComponent(id)}&json=1`;

function importOfp(txt){
  try{

/* ---- Fuel adjustments: editable EXTRA + DISCRETIONARY ----
   Extra fuel loaded must also be carried: ≈3.5 % of the added fuel is burnt per flight hour (rule of thumb). */
const CARRY_RATE=0.035;
const hmToH=s=>{const m=/^(\d+):(\d{2})$/.exec(s||"");return m?(+m[1]+(+m[2])/60):0};
function fuelAdj(){
  const s=S.ofp&&S.ofp.sum; if(!s) return null;

  const d=(x-ofpX)+disc, eteH=hmToH(s.t.ete)||(+s.fuel.trip&&0), carry=Math.round(d*CARRY_RATE*eteH);

    trip:n(s.fuel.trip)!=null?+s.fuel.trip+carry:null, ramp:n(s.fuel.ramp)!=null?+s.fuel.ramp+d:null,
    tof:n(s.fuel.tof)!=null?+s.fuel.tof+d:null, ldg:n(s.fuel.ldg)!=null?+s.fuel.ldg+d-carry:null,
    mintof:n(s.fuel.mintof),

/* ================= WEATHER: METAR / TAF parsing ================= */
const WX_WORDS={"-":"light","+":"heavy",VC:"vicinity",MI:"shallow",BC:"patches",PR:"partial",DR:"drifting",BL:"blowing",SH:"showers",TS:"thunderstorm",FZ:"freezing",
  DZ:"drizzle",RA:"rain",SN:"snow",SG:"snow grains",IC:"ice crystals",PL:"ice pellets",GR:"hail",GS:"small hail",UP:"unknown precip",BR:"mist",FG:"fog",FU:"smoke",VA:"volcanic ash",
  DU:"dust",SA:"sand",HZ:"haze",PO:"dust whirls",SQ:"squalls",FC:"funnel cloud",SS:"sandstorm",DS:"duststorm"};
const WX_RE=/^(\+|-|VC)?(MI|BC|PR|DR|BL|SH|TS|FZ)?((DZ|RA|SN|SG|IC|PL|GR|GS|UP|BR|FG|FU|VA|DU|SA|HZ|PO|SQ|FC|SS|DS)+)$/;
function decodeWx(tok){
  const m=WX_RE.exec(tok); if(!m) return "";
  const parts=[]; if(m[1]) parts.push(WX_WORDS[m[1]]); if(m[2]) parts.push(WX_WORDS[m[2]]);
  (m[3].match(/../g)||[]).forEach(p=>parts.push(WX_WORDS[p]));
  return parts.join(" ");
}
function parseCond(tokens){
  const c={wx:[],clouds:[]};
  for(const t of tokens){
    let m;
    if((m=/^(\d{3}|VRB)(\d{2,3})(?:G(\d{2,3}))?(KT|MPS)$/.exec(t))){ const k=m[4]==="MPS"?1.944:1; c.wdir=m[1]==="VRB"?null:+m[1]; c.vrb=m[1]==="VRB"; c.wspd=Math.round(+m[2]*k); c.gust=m[3]?Math.round(+m[3]*k):null; continue; }
    if((m=/^(\d{3})V(\d{3})$/.exec(t))){ c.wvar=[+m[1],+m[2]]; continue; }
    if(t==="CAVOK"){ c.cavok=true; c.vis=10000; continue; }
    if(/^\d{4}$/.test(t)&&c.vis==null){ c.vis=+t===9999?10000:+t; continue; }
    if((m=/^(P)?(\d{1,2})?(?:\s?(\d)\/(\d))?SM$/.exec(t))){ const v=(+(m[2]||0))+(m[3]?+m[3]/+m[4]:0); c.vis=Math.round(v*1609); if(m[1]) c.vis=10000; continue; }
    if((m=/^(FEW|SCT|BKN|OVC|VV)(\d{3}|\/\/\/)(CB|TCU)?$/.exec(t))){ c.clouds.push({cov:m[1],h:m[2]==="///"?null:+m[2]*100,type:m[3]||""}); continue; }
    if(/^(NSC|SKC|CLR|NCD)$/.test(t)){ c.nsc=true; continue; }
    if((m=/^(M?\d{2})\/(M?\d{2})?$/.exec(t))){ const f=s=>s?(s[0]==="M"?-+s.slice(1):+s):null; c.temp=f(m[1]); c.dew=f(m[2]); continue; }
    if((m=/^Q(\d{4})$/.exec(t))){ c.qnh=+m[1]; continue; }
    if((m=/^A(\d{4})$/.exec(t))){ c.qnh=Math.round(+m[1]/100*33.8639); c.inhg=+m[1]/100; continue; }
    const w=decodeWx(t); if(w) c.wx.push(w);
  }
  const ceil=c.clouds.filter(x=>/BKN|OVC|VV/.test(x.cov)&&x.h!=null).map(x=>x.h);
  c.ceil=ceil.length?Math.min(...ceil):null;
  c.cb=c.clouds.some(x=>x.type);
  return c;
}
function flightCat(c){
  if(c.vis==null&&c.ceil==null&&!c.cavok) return "";
  const v=c.vis==null?99999:c.vis, h=c.ceil==null?99999:c.ceil;
  if(h<500||v<1600) return "LIFR";
  if(h<1000||v<4800) return "IFR";
  if(h<=3000||v<=8000) return "MVFR";
  return "VFR";
}
function parseMetar(raw){
  const toks=raw.replace(/=$/,"").trim().split(/\s+/);
  let i=0; if(/^(METAR|SPECI)$/.test(toks[0])) i++; if(toks[i]==="COR") i++;
  const icao=toks[i]; const time=toks[i+1]&&/^\d{6}Z$/.test(toks[i+1])?toks[i+1]:"";
  let end=toks.findIndex((t,k)=>k>i&&/^(TEMPO|BECMG|NOSIG|RMK)$/.test(t)); if(end<0) end=toks.length;
  const c=parseCond(toks.slice(i+2,end));
  c.icao=icao; c.time=time; c.trend=toks.slice(end).join(" "); c.cat=flightCat(c); c.raw=raw.trim();
  return c;
}
function parseTaf(raw){
  const txt=raw.replace(/\s+/g," ").replace(/=$/,"").trim();
  const toks=txt.split(" ");
  let i=0; if(toks[0]==="TAF") i++; if(/^(AMD|COR)$/.test(toks[i])) i++;
  const icao=toks[i]; i++;
  if(/^\d{6}Z$/.test(toks[i])) i++;
  const valid=/^\d{4}\/\d{4}$/.test(toks[i])?toks[i++]:"";
  const groups=[]; let cur={label:"BASE "+valid,toks:[]};
  for(;i<toks.length;i++){
    const t=toks[i];
    if(/^FM\d{6}$/.test(t)){ groups.push(cur); cur={label:"FM "+t.slice(2,4)+"/"+t.slice(4),toks:[]}; continue; }
    if(t==="BECMG"||t==="TEMPO"){ groups.push(cur); let lab=t; if(/^\d{4}\/\d{4}$/.test(toks[i+1])) lab+=" "+toks[++i]; cur={label:lab,toks:[]}; continue; }
    if(/^PROB\d{2}$/.test(t)){ groups.push(cur); let lab=t; if(toks[i+1]==="TEMPO") lab+=" "+toks[++i]; if(/^\d{4}\/\d{4}$/.test(toks[i+1])) lab+=" "+toks[++i]; cur={label:lab,toks:[]}; continue; }
    if(/^(TX|TN)/.test(t)) continue;
    cur.toks.push(t);
  }
  groups.push(cur);
  return {icao, valid, raw:txt, groups:groups.filter(g=>g.toks.length).map(g=>{const c=parseCond(g.toks);c.cat=flightCat(c);c.label=g.label;return c;})};
}
function splitWxReports(text){
  const lines=text.replace(/\r/g,"").split("\n");
  const out=[]; let cur=null;
  for(const l of lines){
    const t=l.trim(); if(!t){ continue; }
    if(/^TAF\b/.test(t)){ if(cur) out.push(cur); cur={kind:"TAF",raw:t}; continue; }
    if(/^(METAR|SPECI)\b/.test(t)||(/^[A-Z][A-Z0-9]{3}\s\d{6}Z\b/.test(t)&&!(cur&&cur.kind==="TAF"&&/^\s/.test(l)))){
      if(cur) out.push(cur);
      cur={kind:(cur&&cur.kind==="TAF"&&/^\s/.test(l))?"TAF":"METAR",raw:t}; continue; }
    if(cur){ cur.raw+=" "+t; }
  }
  if(cur) out.push(cur);
  return out;
}
const CAT_COL={VFR:"cat-vfr",MVFR:"cat-mvfr",IFR:"cat-ifr",LIFR:"cat-lifr"};
const catBadge=c=>c?`<span class="cat ${CAT_COL[c]}">${c}</span>`:"";
function rwyHdg(r){ const m=/(\d{1,3})/.exec(r||""); if(!m) return null; let n=+m[1]; return n<=36?n*10:n; }
function windComp(rh,wd,ws){
  const a=(wd-rh)*Math.PI/180; return {head:Math.round(ws*Math.cos(a)), cross:Math.round(ws*Math.sin(a))};
}
const kmOrM=v=>v==null?"—":(v>=10000?"≥10 km":v>=5000?(v/1000).toFixed(0)+" km":v+" m");
function condLine(c){
  const p=[];
  if(c.wspd!=null) p.push(c.vrb?`VRB ${c.wspd} kt`:`${String(c.wdir).padStart(3,"0")}° ${c.wspd}${c.gust?"G"+c.gust:""} kt`);
  if(c.cavok) p.push("CAVOK"); else if(c.vis!=null) p.push(kmOrM(c.vis));
  if(c.wx.length) p.push(c.wx.join(", "));
  if(c.clouds.length) p.push(c.clouds.map(x=>x.cov+(x.h!=null?" "+x.h+" ft":"")+(x.type?" "+x.type:"")).join(" · ")); else if(c.nsc) p.push("no sig. cloud");
  return p.join(" · ");
}

function wxAirports(){
  const s=S.ofp&&S.ofp.sum, h=S.briefing.hdr;
  const list=[];
  const add=(icao,role,rwy)=>{ icao=(icao||"").toUpperCase().trim(); if(/^[A-Z0-9]{4}$/.test(icao)&&!list.some(x=>x.icao===icao)) list.push({icao,role,rwy}); };
  add(h.from||(s&&s.from),"DEP",S.briefing.f["dep_pm.departure_runway"]||(s&&s.depRwy));
  add(h.to||(s&&s.to),"ARR",S.briefing.f["arr_pm.expected_runway"]||(s&&s.arrRwy));
  add(s&&s.altn,"ALTN",s&&s.altnRwy);
  (S.wx.extra||"").split(/[\s,]+/).forEach(x=>add(x,"EXTRA",""));
  return list;
}
/* ---- freshness: METAR age from its ddhhmmZ time, TAF validity from ddhh/ddhh ---- */
function zToDate(dd,hh,mm){ const n=new Date(); let d=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),+dd,+hh,+mm||0)); if(d-n>36*3600e3) d=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth()-1,+dd,+hh,+mm||0)); if(n-d>20*86400e3) d=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth()+1,+dd,+hh,+mm||0)); return d; }
function metarAge(raw){ const m=/\b(\d{2})(\d{2})(\d{2})Z\b/.exec(raw||""); if(!m) return null; return Math.round((Date.now()-zToDate(m[1],m[2],m[3]))/60000); }
function tafEnd(raw){ const m=/\b\d{4}\/(\d{2})(\d{2})\b/.exec(raw||""); if(!m) return null; return m[2]==="24"?new Date(zToDate(m[1],0,0).getTime()+86400e3):zToDate(m[1],m[2],0); }
const tafValid=raw=>{ const e=tafEnd(raw); return e?e>new Date():false; };
const METAR_MAX_MIN=60;
function wxFor(icao){
  const L=(S.wx.live&&S.wx.live[icao])||{}; const s=S.ofp&&S.ofp.sum;
  const o=s?({[s.from]:[s.metar.dep,s.taf.dep],[s.to]:[s.metar.arr,s.taf.arr],[s.altn]:[s.metar.altn,""]}[icao]||[]):[];
  const cand=[["live",L.metar],["OFP",o[0]]].filter(x=>x[1]).map(x=>({src:x[0],raw:x[1],age:metarAge(x[1])}));
  cand.sort((x,y)=>(x.age==null?1e9:x.age)-(y.age==null?1e9:y.age));
  const mc=cand[0]||null;
  const tc=[["live",L.taf],["OFP",o[1]]].filter(x=>x[1]);
  const tv=tc.find(x=>tafValid(x[1].startsWith("TAF")?x[1]:"TAF "+x[1]))||tc[0]||null;
  return {metar:mc&&mc.raw, src:mc?mc.src:"", age:mc?mc.age:null, taf:tv&&tv[1], tafSrc:tv?tv[0]:"", tafOk:tv?tafValid(tv[1]):false, at:L.at, fetched:L.fetched};
}
function wxNeedsLive(icao,role){
  const w=wxFor(icao);
  if(role==="EXTRA"&&!w.metar) return true;
  if(!w.metar||w.age==null||w.age>METAR_MAX_MIN) return true;
  if(w.taf&&!w.tafOk) return true;
  if(!w.taf&&role!=="EXTRA"&&role!=="ALTN") return true;
  return false;
}
const relayUrl=()=>(S.settings.relay||"").trim().replace(/\/+$/,"");
let WX_BUSY=false;
async function wxFetchLive(icaos,manual){
  if(WX_BUSY||!icaos.length) return; WX_BUSY=true;
  const r=relayUrl(); const url=r?`${r}/wx?ids=${icaos.join(",")}`:`https://aviationweather.gov/api/data/metar?ids=${icaos.join(",")}&format=raw&taf=true&hours=2`;
  try{
    const res=await fetch(url,{cache:"no-store"}); if(!res.ok) throw new Error(res.status);
    const txt=await res.text(); const now=new Date().toISOString(); S.wx.live=S.wx.live||{};
    icaos.forEach(i=>{ (S.wx.live[i]=S.wx.live[i]||{}).fetched=now; });
    importWx(txt,{silent:!manual});
    if(r){ await sigmetFetch(); if(current==="wx"){ const y=window.scrollY; render(); window.scrollTo(0,y); } }
  }catch(e){
    const now=new Date().toISOString(); icaos.forEach(i=>{ (S.wx.live[i]=S.wx.live[i]||{}).fetched=now; }); save("wx");
    if(manual) toast(r?"Relay unreachable — check the relay URL":"Live weather blocked — set your relay URL (☰ → Settings)");
  }
  WX_BUSY=false;
}
let SIG={text:"",at:0};
async function sigmetFetch(){ const r=relayUrl(); if(!r) return; try{ const res=await fetch(r+"/sigmet",{cache:"no-store"}); if(res.ok){ SIG={text:(await res.text()).slice(0,400000),at:Date.now()}; } }catch(e){} }
function sigmetsFor(prefixes){
  if(!SIG.text) return [];
  const blocks=SIG.text.replace(/\r/g,"").split(/\n(?=\S*W[SCV][A-Z]{2}\d{2}\b)|\n\s*\n/).map(x=>x.trim()).filter(x=>x.length>20);
  if(!prefixes.length) return blocks;
  const re=new RegExp("\\b("+prefixes.join("|")+")[A-Z]{2}\\b");
  return blocks.filter(b=>re.test(b));
}
function ofpBlock(re,max=40){
  const t=S.ofp&&S.ofp.text; if(!t) return "";
  const lines=t.replace(/\u000c/g,"").split("\n"); const i=lines.findIndex(l=>l.trim().length<70&&re.test(l)); if(i<0) return "";
  const out=[lines[i]];
  for(let k=i+1;k<lines.length&&out.length<max;k++){ if(ofpHeading(lines[k])&&!re.test(lines[k])&&out.length>2) break; out.push(lines[k]); }
  return out.join("\n").trim();
}
function importWx(text,opts){
  opts=opts||{}; const reps=splitWxReports(text); let n=0; S.wx.live=S.wx.live||{};
  const now=new Date().toISOString();
  reps.forEach(r=>{
    if(r.kind==="TAF"){ const p=parseTaf(r.raw); if(p.icao&&/^[A-Z0-9]{4}$/.test(p.icao)){ (S.wx.live[p.icao]=S.wx.live[p.icao]||{}).taf=p.raw; S.wx.live[p.icao].at=now; n++; } }
    else { const p=parseMetar(r.raw); if(p.icao&&/^[A-Z0-9]{4}$/.test(p.icao)){ (S.wx.live[p.icao]=S.wx.live[p.icao]||{}).metar=r.raw.replace(/^(METAR|SPECI)\s+/,""); S.wx.live[p.icao].at=now; n++; } }
  });
  if(!n){ if(!opts.silent){ const e=$("#wxErr"); if(e) e.textContent="No METAR or TAF found."; } save("wx"); return; }
  save("wx"); const y=window.scrollY; render(); window.scrollTo(0,y); if(!opts.silent) toast(`${n} weather report${n>1?"s":""} updated`);
}

/* ================= WIND / RUNWAY CALCULATOR ================= */
const RWYCC=[{c:"6",l:"Dry",x:38},{c:"5",l:"Good",x:38},{c:"4",l:"Good to medium",x:29},{c:"3",l:"Medium",x:25},{c:"2",l:"Medium to poor",x:20},{c:"1",l:"Poor",x:15}];
function renderWind(el){

  const rh=rwyHdg(W.rwy), wd=+W.wd, ws=+W.ws||0, gs=+W.gust||0;
  const ok=rh!=null&&W.wd!==""&&W.wd!=null&&!isNaN(wd);
  const c=ok?windComp(rh,wd,ws):null, g=ok&&gs?windComp(rh,wd,gs):null;
  const rc=RWYCC.find(r=>r.c===W.rwycc)||RWYCC[0];
  const xlim=Math.min(+W.xlim||38, isAirbus?rc.x:999), tlim=+W.tlim||10;
  const xMax=Math.abs(g?g.cross:c?c.cross:0), tail=c?Math.max(0,-(g&&g.head<c.head?c.head:c.head)):0;
  const xBad=ok&&xMax>xlim, tBad=ok&&tail>tlim;
  const xWarn=ok&&!xBad&&xMax>xlim*0.8, tWarn=ok&&!tBad&&tail>tlim*0.8;

  const rel=ok?((wd-rh)+360)%360:0;
  const s=S.ofp&&S.ofp.sum;
  const src=[["DEP",S.briefing.hdr.from||(s&&s.from),S.briefing.f["dep_pm.departure_runway"]||(s&&s.depRwy)],["ARR",S.briefing.hdr.to||(s&&s.to),S.briefing.f["arr_pm.expected_runway"]||(s&&s.arrRwy)]].filter(x=>x[1]);
  el.innerHTML=`

      <div class="wf"><label>Wind speed (kt)</label><input id="wWs" class="big" inputmode="numeric" value="${esc(W.ws??"")}" placeholder="15"></div>
      <div class="wf"><label>Gust (kt)</label><input id="wG" class="big" inputmode="numeric" value="${esc(W.gust??"")}" placeholder="—"></div>
      <div class="wf"><label>Runway condition</label><select id="wCc">${RWYCC.map(r=>`<option value="${r.c}" ${r.c===rc.c?"selected":""}>RWYCC ${r.c} · ${r.l}</option>`).join("")}</select></div>
      <div class="wf two"><div><label>X-wind limit</label><input id="wXl" class="big" inputmode="numeric" value="${esc(W.xlim??38)}"></div><div><label>Tailwind limit</label><input id="wTl" class="big" inputmode="numeric" value="${esc(W.tlim??10)}"></div></div>
    </div>
    <div class="card wind-out ${st}">
      <svg viewBox="0 0 200 200" class="rwy-svg">

        ${ok?`<g transform="rotate(${rel} 100 100)"><line x1="100" y1="6" x2="100" y2="58" stroke="var(--cyan)" stroke-width="4" stroke-linecap="round"/><path d="M100 70 L91 54 L109 54 Z" fill="var(--cyan)"/></g>`:""}

  const bind=(id,k)=>{const n=$("#"+id); n.addEventListener(n.tagName==="SELECT"?"change":"input",()=>{S.wind[k]=n.tagName==="SELECT"?n.value:n.value.toUpperCase(); save("wind"); clearTimeout(S._wt); S._wt=setTimeout(()=>{const a=document.activeElement&&document.activeElement.id;render(); if(a){const x=$("#"+a); if(x&&x.setSelectionRange&&x.type!=="select-one"){x.focus();x.setSelectionRange(x.value.length,x.value.length)}}},350);});};
  bind("wRwy","rwy");bind("wWd","wd");bind("wWs","ws");bind("wG","gust");bind("wCc","rwycc");bind("wXl","xlim");bind("wTl","tlim");
  el.querySelectorAll("[data-fill]").forEach(b=>b.onclick=()=>{
    const x=src.find(y=>y[0]===b.dataset.fill); const w=wxFor(x[1]); const m=w.metar?parseMetar(w.metar):null;

    else toast("No METAR for "+x[1]+" — get the weather first");

/* ================= IN-FLIGHT FUEL TRACKER ================= */
function fuelRows(){
  const s=S.ofp&&S.ofp.sum; if(!s) return [];
  const F=fuelAdj(), k=pfVal()/100, tof0=+s.fuel.tof||0, rows=[];
  // planned FOB at a point: OFP value, + added fuel minus its carry burn so far, then perf-factor on the burn
  const adj=(v,tH)=>{ if(v==null) return v; let r=v+F.d-Math.round(F.d*CARRY_RATE*(tH||0)); const tof=tof0+F.d; return k?Math.round(tof-(tof-r)*(1+k)):Math.round(r); };
  if(s.fuel.ramp) rows.push({k:"ramp",id:"BLOCK",awy:"ramp",t:0,fob:+s.fuel.ramp+F.d,min:null});
  if(s.fuel.tof) rows.push({k:"tof",id:"T/O",awy:s.from,t:0,fob:+s.fuel.tof+F.d,min:null});
  (s.nav||[]).forEach((f,i)=>{ if(f.fob) rows.push({k:"n"+i,id:f.id,awy:f.awy,t:+f.t||0,fob:adj(+f.fob,(+f.t||0)/3600),min:f.min?+f.min:null}); });
  if(s.fuel.ldg) rows.push({k:"ldg",id:"LDG",awy:s.to,t:null,fob:adj(+s.fuel.ldg,F.eteH),min:(+s.fuel.altn||0)+(+s.fuel.fres||0)||null});
  return rows;
}
function renderFuel(el){
  const s=S.ofp&&S.ofp.sum, u=s&&s.units==="lbs"?"lb":"kg";
  if(!s){ el.innerHTML=`<div class="page-head"><span class="title-chip">Fuel</span></div><div class="empty">Import your SimBrief OFP first (OFP tab) — the fuel plan for every waypoint comes from it.</div>`; return; }
  if(S.fuel.ofpAt!==S.ofp.at){ S.fuel={ofpAt:S.ofp.at,act:{}}; save("fuel"); }
  const rows=fuelRows(), A=S.fuel.act||{};
  const filled=rows.filter(r=>A[r.k]!=null&&A[r.k]!=="");
  const last=filled[filled.length-1], delta=last?(+A[last.k]-last.fob):null;
  const FA=fuelAdj(); const ldgPlan=FA&&FA.ldg!=null?(FA.ldg-pfExtraBurn()):null;
  const proj=delta!=null&&ldgPlan!=null?(ldgPlan+delta):null;
  const minLdg=(+s.fuel.altn||0)+(+s.fuel.fres||0);
  const projSt=proj==null?"":proj<minLdg?"bad":proj<minLdg+(+s.fuel.cont||0)?"warn":"ok";

  return `<table class="pf-tbl"><thead><tr><th>Factor</th><th>Typical case</th><th></th></tr></thead><tbody>${PF_PRESETS.map(p=>`<tr data-pf="${p[0]}" class="${set&&pf===p[0]?"on":""}"><td class="mono">${p[0]?"+":""}${p[0].toFixed(1)} %</td><td><b>${p[1]}</b> <span>${p[2]}</span></td><td class="pick">${set&&pf===p[0]?"✓":""}</td></tr>`).join("")}</tbody></table>`; }
function pfInputHTML(id){ const pf=pfVal(), x=pfExtraBurn(), s=S.ofp&&S.ofp.sum, u=s&&s.units==="lbs"?"lb":"kg";

     :`<b class="mono">${esc(info.reg)}</b> not in the fleet database — <input class="pf-in" id="${id}Y" inputmode="numeric" placeholder="year" style="width:72px"> <button class="pf-tog" data-ysave="${esc(info.reg)}">save</button> <a class="pf-lk" href="https://www.planespotters.net/search?q=${encodeURIComponent(info.reg)}" target="_blank" rel="noopener">find age ↗</a> ${afLink(info.reg)}`)

  <span class="pf-eff">${pf&&s?`trip ${x>0?"+":""}${num(x)} ${u} · landing fuel ${x>0?"−":"+"}${num(Math.abs(x))} ${u}`:"applies to fuel burn & landing weight — not to distances"}</span>

  el.querySelectorAll("[data-p]").forEach(n=>{

/* ================= RUNWAY VIEW (diagram + remembered runway data & exits) ================= */
function rwyKey(icao,rwy){ icao=(icao||"").toUpperCase().trim(); rwy=(rwy||"").toUpperCase().trim(); return icao&&rwy?icao+"/"+rwy:""; }
function rwyRec(icao,rwy){ const k=rwyKey(icao,rwy); if(!k) return null; S.rwys.db=S.rwys.db||{}; return S.rwys.db[k]||(S.rwys.db[k]={len:"",exits:[]}); }
function perfAirports(){
  const s=S.ofp&&S.ofp.sum, h=S.briefing.hdr;
  return {dep:(h.from||(s&&s.from)||"").toUpperCase(), arr:(h.to||(s&&s.to)||"").toUpperCase()};
}
function estimateExit(exits,stop){
  // RET can be taken at ~40–50 kt: about 250 m before the full-stop point; 90° exits need ~taxi speed
  const sorted=[...exits].filter(e=>+e.d>0).sort((a,b)=>+a.d-+b.d);
  return sorted.find(e=>+e.d>=stop-(e.ret?250:40))||null;
}
function runwaySvg(o){
  // o: {len, rwy, mode, marks:[{d,label,cls,dash}], exits:[{n,d,ret}], est, zones:bool}
  const W=1000, X0=70, X1=W-30, L=Math.max(o.len||0,...o.marks.map(m=>m.d||0),...(o.exits||[]).map(e=>+e.d||0),500)*1.04;
  const sx=d=>X0+(X1-X0)*Math.min(d,L)/L, Y=92, H=34;
  const lenX=o.len?sx(o.len):X1;
  let g=`<rect x="0" y="0" width="${W}" height="190" fill="#121317"/>`;
  // grass/overrun beyond LDA
  if(o.len) g+=`<rect x="${lenX}" y="${Y}" width="${Math.max(0,X1-lenX)}" height="${H}" fill="#2b1d22" stroke="#5a2630" stroke-dasharray="4 4"/>`;
  g+=`<rect x="${X0}" y="${Y}" width="${lenX-X0}" height="${H}" fill="#2a2c33" stroke="#55596a"/>`;
  // threshold bars
  for(let i=0;i<6;i++) g+=`<rect x="${X0+4}" y="${Y+3+i*5}" width="14" height="3" fill="#d9dbe3"/>`;
  g+=`<text x="${X0+26}" y="${Y+H/2+5}" fill="#eceef3" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" font-weight="700" transform="rotate(90 ${X0+26} ${Y+H/2})" text-anchor="middle">${esc(o.rwy||"")}</text>`;
  // centreline
  for(let x=X0+50;x<lenX-20;x+=34) g+=`<rect x="${x}" y="${Y+H/2-1}" width="18" height="2" fill="#c8cad3"/>`;
  // aiming point / TDZ (landing)
  if(o.mode==="ldg"){ const a=sx(400); g+=`<rect x="${a}" y="${Y+4}" width="${Math.max(6,sx(460)-a)}" height="7" fill="#e8e9ee"/><rect x="${a}" y="${Y+H-11}" width="${Math.max(6,sx(460)-a)}" height="7" fill="#e8e9ee"/>`;
    [150,300,450,600,750,900].forEach(d=>{ if(d<(o.len||L)) g+=`<rect x="${sx(d)}" y="${Y+5}" width="3" height="5" fill="#bfc1ca"/><rect x="${sx(d)}" y="${Y+H-10}" width="3" height="5" fill="#bfc1ca"/>`; }); }
  // exits
  (o.exits||[]).forEach(e=>{ const d=+e.d; if(!(d>0)) return; const x=sx(d); const isEst=o.est&&o.est===e;
    const col=isEst?"#3ecf8e":"#7d8193";
    g+= e.ret?`<path d="M${x-26} ${Y} L${x} ${Y-34}" stroke="${col}" stroke-width="${isEst?7:6}" stroke-linecap="round" opacity=".9"/>`
             :`<path d="M${x} ${Y} L${x} ${Y-34}" stroke="${col}" stroke-width="${isEst?7:6}" stroke-linecap="round" opacity=".9"/>`;
    g+=`<text x="${x}" y="${Y-40}" text-anchor="middle" fill="${isEst?"#3ecf8e":"#c9ccd6"}" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="${isEst?700:500}">${esc(e.n)}${isEst?" ✓":""}</text>`; });
  // marks
  o.marks.forEach((m,i)=>{ if(!(m.d>0)) return; const x=sx(m.d), yb=Y+H+8+ (i%2)*22;
    g+=`<line x1="${x}" y1="${Y-4}" x2="${x}" y2="${yb+4}" stroke="${m.col}" stroke-width="2.4" ${m.dash?'stroke-dasharray="5 4"':""}/>`;
    g+=`<text x="${x}" y="${yb+16}" text-anchor="${x>W-140?"end":x<X0+80?"start":"middle"}" fill="${m.col}" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12.5" font-weight="600">${esc(m.label)} ${num(Math.round(m.d))} m</text>`; });
  if(o.len) g+=`<text x="${lenX-6}" y="${Y-8}" text-anchor="end" fill="#9a9eab" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12">${o.mode==="ldg"?"LDA":"TORA"} ${num(o.len)} m</text>`;
  g+=`<path d="M18 ${Y+H/2} l18 -9 v18 z" fill="var(--mag)"/>`;
  return `<div class="rwy-scroll"><svg viewBox="0 0 ${W} 190" class="rwy-view" preserveAspectRatio="xMidYMid meet">${g}</svg></div>`;
}
function rwyViewHTML(T,to,ld){
  const P=S.perf, aps=perfAirports(), mode=S.rwys.view||"ldg";
  const icao=mode==="ldg"?aps.arr:aps.dep, rwy=mode==="ldg"?P.ldg.rwy:P.to.rwy, rec=rwyRec(icao,rwy);
  const exits=rec?rec.exits:[];
  let marks=[], est=null, info="";
  if(mode==="ldg"){
    marks=[{d:400,label:"TD",col:"#9a9eab"},{d:ld.actual,label:"STOP "+ld.ab+(ld.rev==="MAX"?"+MAX REV":ld.rev==="NO REV"?" NO REV":""),col:ld.okAct===false?"#ff5a6a":"#58c7e8"},{d:ld.required,label:"REQ",col:"#f2b33d",dash:1}];
    est=estimateExit(exits,ld.actual);

function insignia(kind,w){
  w=w||52; const h=Math.round(w*0.66);
  if(kind==="wings"){ const gl=!isWizz(), pp=curProf()?profPalette(curProf().color):null, C=pp?{a:pp.wa,b:pp.wb,ring:pp.ring,line:pp.line,bg:"#0b0d14",pl:pp.mag,id:"wgP"}:gl?{a:"#0b2b63",b:"#1d5fc4",ring:"#4d9bff",line:"#8cc2ff",bg:"#081a3d",pl:"#1f6fe5",id:"wgB"}:{a:"#1f1a6e",b:"#3a2a9e",ring:"#c6007e",line:"#7c5cff",bg:"#0f1240",pl:"#c6007e",id:"wgM"};
    return `<svg viewBox="0 0 120 52" width="${Math.round(w*1.45)}" height="${h}" aria-hidden="true"><defs><linearGradient id="${C.id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${C.a}"/><stop offset="1" stop-color="${C.b}"/></linearGradient></defs>
    <path d="M30 18 L114 6 L108 30 L34 40 Z" fill="url(#${C.id})" stroke="${C.ring}" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M38 22 L108 13 M38 28 L106 20 M38 34 L104 26" stroke="${C.line}" stroke-width="1.6"/>
    <circle cx="25" cy="30" r="19" fill="${C.bg}" stroke="${C.ring}" stroke-width="3.4"/><circle cx="25" cy="30" r="13.5" fill="#fff"/>
    <g transform="translate(25 30) rotate(45) scale(.62) translate(-20 -20)"><path fill="${C.pl}" d="M20 7.5c1 0 1.6 1.1 1.6 2.5v6.4l9.4 5.4v2.5l-9.4-2.8v5.7l2.7 2v1.9L20 29.9l-4.3 1.2v-1.9l2.7-2v-5.7L9 24.3v-2.5l9.4-5.4V10c0-1.4.6-2.5 1.6-2.5z"/></g></svg>`; }
  const n=kind==="ep1"?1:kind==="ep4"?4:3, sw=n===4?5.2:6, gap=n===4?3.6:5, tot=n*sw+(n-1)*gap, x0=(52-tot)/2;
  let st=""; for(let i=0;i<n;i++) st+=`<rect x="${(x0+i*(sw+gap)).toFixed(1)}" y="0" width="${sw}" height="34" fill="url(#sv)"/>`;
  return `<svg viewBox="0 0 52 34" width="${w}" height="${h}" aria-hidden="true"><defs><linearGradient id="sv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9da0a8"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#9da0a8"/></linearGradient></defs><rect width="52" height="34" rx="2.5" fill="#05060c"/>${st}</svg>`;
}
function pilotStats(){ const l=S.flights.list||[]; const m=l.reduce((s,f)=>s+blockMin(f),0); return {hours:m/60, flights:l.length}; }
function rankInfo(){
  const st=pilotStats(); const earned=RANKS.filter(r=>r.h!=null&&st.hours>=r.h&&st.flights>=r.f);
  const cur=earned[earned.length-1]||RANKS[0]; const next=RANKS.find(r=>r.h!=null&&!(st.hours>=r.h&&st.flights>=r.f));
  let prog=1, need=""; if(next){ const ph=next.h?Math.min(1,st.hours/next.h):1, pf=next.f?Math.min(1,st.flights/next.f):1; prog=Math.min(ph,pf);
    const hh=Math.max(0,next.h-st.hours), ff=Math.max(0,next.f-st.flights); need=[hh>0?Math.ceil(hh)+" h":"", ff>0?ff+" PIREP"+(ff>1?"s":""):""].filter(Boolean).join(" and "); }
  return {st,cur,next,prog,need};
}

function importData(){
  openModal(`<div class="modal-h"><h3>Import data</h3><button class="x" data-close>×</button></div>
   <div style="padding:14px 16px"><p class="muted" style="font-size:12.5px;margin-top:0">Paste the exported data (or pick the backup file). It <b>replaces</b> the data on this device.</p>

  $("#modal").querySelector("[data-close]").onclick=closeModal;
  const run=txt=>{ try{ const o=JSON.parse(txt); if(!o||o.app!=="efb"||!o.data) throw 0;
      Object.keys(DEFAULTS).forEach(k=>{ if(o.data[k]) { S[k]=Object.assign({},DEFAULTS[k],o.data[k]); save(k); } });
      migrate(); applyLogImports(); normalizeTypes(); applyMode(); closeModal(); render(); toast(`Imported · ${S.flights.list.length} flights`);
    }catch(e){ $("#impErr").textContent="This is not an EFB export."; } };
  $("#impGo").onclick=()=>run($("#impTxt").value.trim());
  $("#impFile").onchange=e=>{ const f=e.target.files[0]; if(f) f.text().then(run); };
}
function toggleDrawer(show){$("#drawer").classList.toggle("show",show);$("#dscrim").classList.toggle("show",show);document.documentElement.classList.toggle("lock",!!show);if(show){renderDrawer();$("#drawer").scrollTop=0;}}
$("#menuBtn").onclick=()=>toggleDrawer(true);
$("#dscrim").onclick=()=>toggleDrawer(false);
$("#pilotName").onclick=()=>toggleDrawer(true);
$("#rankBadge").onclick=()=>rankModal();
$("#fsBtn").onclick=()=>toggleFullscreen();
$("#dimBtn").onclick=()=>dimModal(); applyDim();
$("#uiBtn").onclick=()=>setUi("tablet");

let _lastView="";
function render(){
  updateTabs(); updateStatus(); tbBar();
  const v=$("#view"), key=current+"|"+(isTab()?appOf():"");
  if(isTab()&&key!==_lastView){ v.classList.remove("tb-anim"); void v.offsetWidth; v.classList.add(current==="home"?"tb-anim":"tb-anim"); v.dataset.home=current==="home"?"1":""; }
  _lastView=key; v.dataset.home=isTab()&&current==="home"?"1":"";
  if(current==="home"){ if(isTab()){ renderHome(v); return; } current=MODULES[0].id; }
  const m=MODULES.find(x=>x.id===current); m.render(v);
}
window.addEventListener("hashchange",()=>go(location.hash.slice(1)));
applyMode(); badgeInit();
document.documentElement.classList.toggle("imm",!!S.settings.imm); setTimeout(updateFsBtn,0);
document.documentElement.classList.toggle("imm",!!S.settings.imm); setTimeout(updateFsBtn,0);
applyUi(); go(location.hash.slice(1)||(isTab()?"home":"briefing"));
connect();

if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }</script>
